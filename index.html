<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fd">
<title>Happy Birthday 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --navy:#1f2d57; --ink:#2a3768; --blue:#3f6fd1; --sky:#9cc0f5; --ice:#e7effc; --silver:#c9d2df;
  --paper:#fdfdff; --bg:#f4f7fd; --line:#d7e2f5; --pink:#f3a9c0;
  --hand:'Caveat',cursive; --round:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1); --spd:1;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--body); color:var(--ink); overflow:hidden; background:var(--bg); -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px dashed var(--blue);outline-offset:5px;border-radius:12px}
svg.defs{position:absolute;width:0;height:0}
.pre{opacity:0}

/* ---------- scenes ---------- */
.scene{
  position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; z-index:1;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg);
  opacity:0; visibility:hidden; transition:opacity calc(.9s / var(--spd)) ease, visibility 0s linear calc(.9s / var(--spd));
}
.scene.active{opacity:1; visibility:visible; z-index:2; transition:opacity calc(1s / var(--spd)) ease calc(.35s / var(--spd)), visibility 0s}
.scene.snap{transition:none!important}
.scene.turning{z-index:6; transform-origin:0 50%}
/* nothing loops in a scene you can't see */
.scene:not(.active) *{animation-play-state:paused!important}
.turn-shade,.turn-light{position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none; z-index:50}
.turn-shade{background:linear-gradient(90deg, rgba(31,45,87,.34), rgba(31,45,87,.1) 45%, rgba(31,45,87,0) 78%)}
.turn-light{background:linear-gradient(90deg, rgba(255,255,255,0) 20%, rgba(31,45,87,.4))}
.iris-ring{position:fixed; z-index:9; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; border:3px solid rgba(156,192,245,.95); box-shadow:0 0 28px rgba(156,192,245,.85), inset 0 0 18px rgba(156,192,245,.6); pointer-events:none}
.wrap{position:relative; z-index:2; min-height:100%; max-width:760px; margin:0 auto; padding:84px 20px 72px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none}
.wrap > *{pointer-events:auto}
.decor{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;
  transform:translate3d(calc(var(--px,0) * -14px), calc(var(--py,0) * -10px), 0); transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.decor > *{position:absolute}
.decor .sticker,.decor .bal{pointer-events:auto; cursor:pointer}

/* ---------- shared bits ---------- */
.btn{
  position:relative; overflow:hidden;
  display:inline-flex; align-items:center; gap:.5em; margin-top:26px; padding:15px 26px; border-radius:999px;
  font-family:var(--round); font-weight:600; font-size:clamp(16px,4.3vw,19px); letter-spacing:.2px; color:#fff;
  background:linear-gradient(180deg,#5a87e3,#2f58b8); box-shadow:0 6px 0 #22448f, 0 12px 26px rgba(40,70,150,.28);
  transition:transform .2s ease, box-shadow .2s ease, opacity .4s ease;
}
.btn::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform:translateX(-130%); animation:btnshine 5.5s ease-in-out 2.5s infinite}
@keyframes btnshine{0%,72%{transform:translateX(-130%)}90%,100%{transform:translateX(130%)}}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #22448f, 0 6px 14px rgba(40,70,150,.25)}
.btn.ghost{background:#fff; color:var(--navy); box-shadow:0 5px 0 var(--silver), 0 10px 20px rgba(40,70,150,.12); border:2px solid var(--silver)}
.btn.ghost::after{background:linear-gradient(110deg, transparent 35%, rgba(156,192,245,.35) 50%, transparent 65%)}
.btn[disabled]{opacity:.5; pointer-events:none}
.paper{position:relative; background:var(--paper); border-radius:6px; padding:26px 24px; box-shadow:0 1px 0 rgba(31,45,87,.06), 0 14px 34px rgba(31,45,87,.12)}
.tape{position:absolute; width:96px; height:28px; top:-13px; left:50%; transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(90deg, rgba(156,192,245,.78) 0 8px, rgba(190,214,250,.78) 8px 16px); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tape.t2{background:repeating-linear-gradient(45deg, rgba(201,210,223,.88) 0 6px, rgba(235,240,247,.88) 6px 12px)}
.hint{font-family:var(--hand); font-size:22px; color:#5c6c9c; margin-top:10px}
.squiggle{display:block; margin:10px auto 0; width:150px; height:14px; overflow:visible}

/* denim-patch headings */
.h2{font-family:var(--round); font-weight:700; font-size:clamp(32px,9vw,50px); line-height:1.08; letter-spacing:.5px;
  background:repeating-linear-gradient(55deg,#4a72bd 0 2px,#3a5fa6 2px 4px,#5a82c9 4px 5px); -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:1.5px #fff; filter:drop-shadow(1.5px 0 0 #1f2d57) drop-shadow(-1.5px 0 0 #1f2d57) drop-shadow(0 1.5px 0 #1f2d57) drop-shadow(0 -1.5px 0 #1f2d57) drop-shadow(0 6px 8px rgba(31,45,87,.22))}
.sticker{filter:drop-shadow(0 3px 3px rgba(31,45,87,.28))}

/* ---------- cats (built by catSVG) ---------- */
.kitty{overflow:visible; display:block; pointer-events:auto; cursor:pointer}
.kitty .k-eyes{transform-box:fill-box; transform-origin:center; animation:blink var(--bt,5.4s) var(--bd,0s) infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.kitty .k-ear.r{transform-box:fill-box; transform-origin:40% 100%; animation:twitch 8s var(--td,2s) infinite}
@keyframes twitch{0%,87%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}93%{transform:rotate(6deg)}96%{transform:rotate(-3deg)}}
.kitty .k-tail{transform-box:fill-box; transform-origin:0 100%; animation:wag 3s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.kitty .k-head{transform-box:view-box; transform-origin:60px 96px; animation:tilt 12s ease-in-out var(--hd,3s) infinite}
@keyframes tilt{0%,68%,100%{transform:rotate(0)}74%,88%{transform:rotate(-9deg)}}
.kitty .k-arms{opacity:0; transform-box:view-box; transform-origin:60px 100px; transform:scale(.5); transition:opacity .25s ease, transform .45s cubic-bezier(.34,1.56,.64,1)}
.kitty.celebrate .k-arms{opacity:1; transform:none}
.kitty.celebrate{animation:hop .62s cubic-bezier(.3,.7,.4,1) 4}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-12%) scale(.97,1.04)}}
.kitty.toss{animation:hop .62s cubic-bezier(.3,.7,.4,1) 1}
.kitty .k-wave{transform-box:view-box; transform-origin:92px 98px}
.kitty.waving .k-wave{animation:wave 1s ease-in-out 3}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-24deg)}70%{transform:rotate(14deg)}}
.kitty .k-hat{transform-box:fill-box; transform-origin:50% 80%}
.kitty.hats .k-hat{animation:hattoss 1.6s cubic-bezier(.3,.7,.4,1) 1}
@keyframes hattoss{0%{transform:none}38%{transform:translateY(-62px) rotate(-180deg)}58%{transform:translateY(-70px) rotate(-290deg)}86%{transform:translateY(4px) rotate(-360deg)}100%{transform:rotate(-360deg)}}

/* ---------- HUD ---------- */
.hud{position:fixed; top:max(12px, env(safe-area-inset-top)); z-index:30; display:flex; gap:8px}
.hud.left{left:12px} .hud.right{right:12px}
.pill{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.9); border:1.5px solid var(--silver);
  font-family:var(--round); font-weight:600; font-size:14px; color:var(--navy); box-shadow:0 4px 12px rgba(31,45,87,.1)}
.pill svg{width:16px; height:16px}
#musicBtn .pause{display:none} #musicBtn.playing .play{display:none} #musicBtn.playing .pause{display:inline}
#motionBtn .dot{width:10px; height:10px; border-radius:50%; border:2px solid var(--navy)}
#motionBtn[aria-pressed="true"] .dot{background:var(--navy)}
.dots{position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom)); z-index:30; display:flex; gap:8px}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--silver); transition:all .6s ease}
.dots i.on{width:22px; border-radius:6px; background:var(--blue)}
@media (max-width:420px){ .pill .lbl{display:none} .pill{padding:9px 11px} }

/* ---------- envelope (S1 and S4) ---------- */
.env-box{position:relative; margin:8px auto 0}
.ground{position:absolute; left:8%; right:8%; bottom:-24px; height:30px; border-radius:50%; background:radial-gradient(closest-side, rgba(31,45,87,.3), rgba(31,45,87,0)); filter:blur(3px)}
.env{position:relative; width:min(88vw,430px); aspect-ratio:1.42; perspective:1100px; cursor:pointer; transition:transform .55s var(--ease)}
.env > .back,.env > .front,.env > .flap,.env > .card{position:absolute; left:0; width:100%}
.env > .back{inset:0; height:100%; z-index:1; border-radius:10px; background:linear-gradient(160deg,#cfe0fb,#a9c6f3); box-shadow:0 14px 30px rgba(31,45,87,.2); transition:box-shadow .55s ease}
.env > .glow-in{position:absolute; left:6%; right:6%; top:-36%; height:84%; z-index:1; border-radius:50%; pointer-events:none;
  background:radial-gradient(closest-side, rgba(255,250,228,.95), rgba(190,215,255,.55) 48%, rgba(190,215,255,0)); opacity:0; transform:scale(.55);
  transition:opacity calc(1.2s / var(--spd)) ease calc(.7s / var(--spd)), transform calc(1.6s / var(--spd)) var(--ease) calc(.7s / var(--spd))}
.env.open > .glow-in{opacity:1; transform:none}
.env > .card{left:6%; width:88%; top:8%; height:84%; z-index:2; border-radius:6px; background:var(--paper); box-shadow:0 2px 6px rgba(0,0,0,.08);
  display:flex; align-items:flex-start; justify-content:center; padding-top:9%;
  transition:transform calc(1.3s / var(--spd)) cubic-bezier(.25,.8,.25,1) calc(.95s / var(--spd))}
.env > .card span{font-family:var(--round); font-weight:700; font-size:clamp(18px,5vw,26px); color:var(--blue)}
.env > .front{bottom:0; height:100%; z-index:3; border-radius:10px; overflow:hidden; pointer-events:none}
.env > .front::before{content:""; position:absolute; inset:0; background:linear-gradient(170deg,#e3edfd,#bcd3f7); clip-path:polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%)}
.env > .front::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(31,45,87,.07), transparent 40%); clip-path:polygon(0 100%, 50% 50%, 100% 100%)}
.env > .flap{top:0; height:58%; z-index:4; transform-origin:50% 0; transform-style:preserve-3d;
  transition:transform calc(1.3s / var(--spd)) cubic-bezier(.45,0,.2,1), z-index 0s calc(.64s / var(--spd))}
.env > .flap > i{position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden}
.env > .flap > .f-out{clip-path:polygon(0 0,100% 0,50% 100%); background:linear-gradient(180deg,#d7e5fc,#b3cdf5)}
/* the envelope liner, seen once the flap folds back */
.env > .flap > .f-in{clip-path:polygon(0 100%,100% 100%,50% 0); transform:rotateX(180deg);
  background:radial-gradient(circle, rgba(255,255,255,.6) 1.2px, transparent 1.9px) 0 0/14px 14px, linear-gradient(0deg,#3a5fa6,#1f2d57)}
.env .seal{position:absolute; left:50%; top:58%; width:58px; height:58px; margin:-36px 0 0 -29px; z-index:6; filter:drop-shadow(0 3px 5px rgba(31,45,87,.32))}
.env .seal .sh{position:absolute; inset:0; border-radius:50%; overflow:hidden; display:grid; place-items:center;
  background:radial-gradient(circle at 35% 30%,#ffffff,#d3dbe7 45%,#9aa8bd); box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
/* a jagged crack line, so the seal can break in two */
.env .seal .sh.l{clip-path:polygon(0 0,53% 0,46% 28%,55% 52%,45% 76%,51% 100%,0 100%)}
.env .seal .sh.r{clip-path:polygon(53% 0,100% 0,100% 100%,51% 100%,45% 76%,55% 52%,46% 28%)}
.env .seal svg{width:28px; height:28px; fill:var(--blue); animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(.97)}42%{transform:scale(1.08)}60%{transform:scale(1)}}
.env .seal .sh::after{content:""; position:absolute; inset:-20%; background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%); transform:translateX(-120%); animation:glint 5s ease-in-out 1.8s infinite}
@keyframes glint{0%,72%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}
.env .addr{position:absolute; z-index:5; left:0; right:0; bottom:9%; padding:0 10%; font-family:var(--hand); color:var(--navy); line-height:1.1; pointer-events:none}
.env .addr b{display:block; font-size:clamp(24px,6.6vw,34px); font-weight:700}
.env .addr em{display:block; font-style:normal; font-size:clamp(19px,5vw,25px); color:#45579a}
.env .stk{position:absolute; z-index:7; pointer-events:none}
.env .peek{position:absolute; z-index:0; right:7%; top:-31%; width:27%}
.env.open > .flap{transform:rotateX(180deg); z-index:0}
.env.open > .card{transform:translateY(-46%)}
@media (hover:hover){
  .env:not(.open):hover{transform:translateY(-8px)}
  .env:not(.open):hover > .back{box-shadow:0 28px 46px rgba(31,45,87,.28)}
}
.env.wiggle{animation:wiggle 6.5s ease-in-out 4s infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}88.5%{transform:rotate(-2.2deg)}91.5%{transform:rotate(2deg)}94.5%{transform:rotate(-1deg)}}
.xfer{position:fixed; z-index:20; background:var(--paper); border-radius:6px; display:flex; align-items:flex-start; justify-content:center; pointer-events:none; box-shadow:0 20px 50px rgba(31,45,87,.25)}
.xfer span{font-family:var(--round); font-weight:700; color:var(--blue); font-size:clamp(18px,5vw,26px); margin-top:6%}

/* ---------- S2 ---------- */
.bunting{position:absolute; top:0; left:-2%; width:104%; height:90px}
.bunting .flag-g{transform-box:fill-box; transform-origin:50% 0; animation:flutter 3.2s ease-in-out infinite alternate}
.bunting .flag{transform-box:fill-box; transform-origin:50% 0}
@keyframes flutter{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.bal{position:absolute}
.bal > svg{display:block; width:100%; height:auto; overflow:visible; transform-origin:50% 100%; animation:sway 6.5s ease-in-out infinite alternate}
.bal.d2 > svg{animation-duration:7.6s; animation-delay:-2s} .bal.d3 > svg{animation-duration:5.6s; animation-delay:-3.4s}
@keyframes sway{0%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(2deg) translateY(-12px)}100%{transform:rotate(3.5deg) translateY(-4px)}}
.bstr{transform-box:fill-box; transform-origin:50% 0; animation:strsway 2.6s ease-in-out infinite alternate}
@keyframes strsway{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.corner-cat,.cat-in{transform-origin:50% 100%}
.corner-cat{position:absolute; bottom:2%}
.halo{position:absolute; left:50%; top:40px; width:min(120vw,860px); height:330px; margin-left:calc(min(120vw,860px) / -2); z-index:-1; pointer-events:none!important;
  background:radial-gradient(closest-side, rgba(255,255,255,.85), rgba(214,230,255,.35) 50%, rgba(214,230,255,0))}
#s2 .paper{max-width:600px; margin-top:24px; font-size:clamp(16.5px,4.3vw,19px); line-height:1.7; text-align:left}

/* silver balloon lettering */
.balloon-title{font-family:var(--round); font-weight:700; line-height:1.02; font-size:clamp(46px,13.5vw,96px); letter-spacing:.5px; filter:drop-shadow(0 3px 0 #9aa8bd) drop-shadow(0 10px 16px rgba(31,45,87,.22))}
.balloon-title .w{display:inline-block; white-space:nowrap; margin:0 .14em}
.balloon-title .li{display:inline-block; transform-origin:50% 90%}
.balloon-title .l{
  display:inline-block;
  background-image:linear-gradient(105deg, transparent 0 40%, rgba(255,255,255,.95) 50%, transparent 60% 100%),
                   linear-gradient(180deg,#ffffff 0%,#dfe5ee 16%,#8d9aae 44%,#f4f7fa 58%,#6f7c92 84%,#c3ccd8 100%);
  background-size:320% 100%, 100% 100%; background-position:160% 0, 0 0; background-repeat:no-repeat;
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:2px #5f6c82;
}
.balloon-title .w.blue .l{background-image:linear-gradient(105deg, transparent 0 40%, rgba(255,255,255,.9) 50%, transparent 60% 100%),
  linear-gradient(180deg,#e6f0ff 0%,#9cc0f5 26%,#3f6fd1 55%,#9cc0f5 72%,#2f58b8 100%); -webkit-text-stroke-color:#2b4f9e}
.balloon-title.bobbing .l{animation:bob 3.8s ease-in-out calc(var(--i) * -.23s) infinite, shine 8s ease-in-out var(--sd,0s) infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(calc(var(--r) * 1deg))}50%{transform:translateY(-7px) rotate(calc(var(--r) * -1deg))}}
@keyframes shine{0%{background-position:160% 0, 0 0}14%,100%{background-position:-70% 0, 0 0}}

/* ---------- fairy lights (S3, S4) ---------- */
.fairy{position:absolute; left:-3%; width:106%; top:2px; height:70px}
.fairy svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.fairy .bulb{position:absolute; width:11px; height:15px; margin:0 0 0 -5.5px; border-radius:50% 50% 45% 45%;
  background:radial-gradient(circle at 40% 35%, #fff, var(--c) 62%); box-shadow:0 0 10px 3px var(--g); animation:twinkle 3.4s ease-in-out var(--d) infinite}
.fairy .bulb::before{content:""; position:absolute; left:3px; top:-4px; width:5px; height:5px; background:#8796ad; border-radius:1px}
@keyframes twinkle{0%,100%{opacity:.55; box-shadow:0 0 4px 1px var(--g)}50%{opacity:1; box-shadow:0 0 14px 5px var(--g)}}
#s4 .fairy .bulb{animation-duration:6s}

/* ---------- S3 gallery ---------- */
.gallery{display:grid; grid-template-columns:repeat(2,1fr); gap:34px 18px; width:100%; margin-top:30px; padding:0 4px}
@media (min-width:720px){ .gallery{grid-template-columns:repeat(3,1fr); gap:40px 26px} }
.pw{position:relative}
.polaroid{position:relative; z-index:1; background:#fff; padding:9px 9px 0; border-radius:3px; cursor:pointer; transform:rotate(var(--r));
  box-shadow:0 2px 4px rgba(31,45,87,.08), 0 12px 24px rgba(31,45,87,.14); transition:transform .5s var(--ease), box-shadow .5s ease}
/* holographic sheen that follows the mouse */
.polaroid::after{content:""; position:absolute; inset:0; border-radius:3px; pointer-events:none; opacity:0; transition:opacity .45s ease; mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%), rgba(255,255,255,.9), rgba(190,215,255,.35) 28%, rgba(255,255,255,0) 58%)}
@media (hover:hover){
  .polaroid:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.035); box-shadow:0 22px 36px rgba(31,45,87,.22); z-index:3}
  .polaroid:hover::after{opacity:1}
}
.polaroid:active{transform:rotate(var(--r)) scale(.965); transition-duration:.15s}
.polaroid .ph{aspect-ratio:1; background:var(--ice) center/cover no-repeat; border-radius:2px; overflow:hidden; display:grid; place-items:center}
.polaroid .ph.empty{background:repeating-linear-gradient(135deg,#eef4fe 0 12px,#e4edfc 12px 24px)}
.polaroid .ph.empty div{font-family:var(--hand); color:#6f80b0; font-size:19px; line-height:1}
.polaroid .ph.empty svg{width:46%; height:auto; display:block; margin:0 auto 4px}
.polaroid p{font-family:var(--hand); font-size:clamp(17px,4.6vw,21px); line-height:1.05; color:var(--navy); padding:9px 2px 12px; min-height:3.2em; display:flex; align-items:center; justify-content:center}
.polaroid .tape{width:70px; height:22px; top:-10px}
.polaroid .stk{position:absolute; width:44px; height:44px; pointer-events:none; z-index:2}
.peeker{position:absolute; z-index:0; left:14%; top:-34px; width:62px; transform:translateY(70%); animation:peekloop 12s ease-in-out var(--pd,3s) infinite}
@keyframes peekloop{0%,62%,100%{transform:translateY(70%)}68%,86%{transform:translateY(0)}72%{transform:translateY(-4%) rotate(-4deg)}}

/* lightbox (the tapped frame grows into it) */
.lb{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:20px; visibility:hidden}
.lb.on{visibility:visible}
.lb-bg{position:absolute; inset:0; background:rgba(22,32,64,.6); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); opacity:0; transition:opacity .5s ease}
.lb.on .lb-bg{opacity:1} .lb.closing .lb-bg{opacity:0}
.lb-body{position:relative}
.lb-card{background:#fff; padding:12px 12px 0; border-radius:4px; box-shadow:0 30px 60px rgba(0,0,0,.35); max-width:min(92vw,560px); transform-origin:0 0}
.lb-img{display:block; max-width:100%; max-height:62vh; margin:0 auto; border-radius:2px}
.lb-card p{font-family:var(--hand); font-size:clamp(22px,6vw,28px); color:var(--navy); text-align:center; padding:12px 6px 14px}
.lb-nav{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; transition:opacity .4s ease}
.lb.closing .lb-nav,.lb.closing .lb-close{opacity:0}
.lb-nav button{width:46px; height:46px; border-radius:50%; background:#fff; color:var(--navy); font-size:22px; box-shadow:0 6px 14px rgba(0,0,0,.2)}
.lb-nav span{color:#fff; font-family:var(--round); font-weight:600; min-width:56px; text-align:center}
.lb-close{position:absolute; z-index:2; top:max(14px, env(safe-area-inset-top)); right:14px; width:46px; height:46px; border-radius:50%; background:#fff; color:var(--navy); font-size:22px; box-shadow:0 6px 14px rgba(0,0,0,.2); transition:opacity .4s ease}

/* ---------- S4 letter ---------- */
.veil{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity 2.4s ease;
  background:radial-gradient(130% 100% at 50% 35%, rgba(255,246,232,0) 55%, rgba(70,60,110,.12))}
.veil.on{opacity:1}
#s4 .env{width:min(78vw,360px)}
#s4 .env > .back{background:linear-gradient(160deg,#2f4f99,#1f2d57)}
#s4 .env > .front::before{background:linear-gradient(170deg,#3d62b5,#26407e)}
#s4 .env > .flap > .f-out{background:linear-gradient(180deg,#4a70c2,#2c4b92)}
#s4 .env > .flap > .f-in{background:radial-gradient(circle, rgba(63,111,209,.45) 1.2px, transparent 1.9px) 0 0/14px 14px, linear-gradient(0deg,#eef3fc,#d7e2f5)}
#s4 .env .addr{color:#fff; bottom:12%} #s4 .env .addr b{font-size:clamp(26px,7vw,34px)}
.letter-wrap{position:relative; width:100%; max-width:600px; margin:4px 0 46px}
.letter{position:relative; z-index:1; text-align:left;
  background:linear-gradient(transparent 31px, #dfe8f8 32px) 0 14px/100% 32px, var(--paper);
  padding:34px 26px 26px 36px; font-family:var(--hand); font-size:clamp(22px,5.8vw,27px); line-height:32px; color:var(--navy); border-left:3px double #f2b8c9}
.letter p{margin-bottom:16px}
.letter p.greet{font-size:1.25em; font-weight:700; color:var(--blue)}
.letter p.closing{font-weight:700; margin-bottom:4px}
.doodle-heart{display:block; width:62px; height:56px; margin:0 0 0 auto; overflow:visible}
.letter-peek{position:absolute; z-index:0; right:16px; bottom:-52px; width:78px; transform:rotate(-7deg)}
/* the tri-fold: three slices of the letter that unfold in 3D */
.fold{position:absolute; inset:0; z-index:2; perspective:1500px; pointer-events:none}
.fold .band{position:absolute; inset:0; transform-style:preserve-3d}
.fold .face{position:absolute!important; inset:0; margin:0!important; -webkit-backface-visibility:hidden; backface-visibility:hidden}
.fold .back{position:absolute; left:0; right:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; transform:rotateX(180deg);
  background:linear-gradient(180deg,#f6f8fd,#e8eef8); box-shadow:inset 0 0 0 1px rgba(31,45,87,.05)}
.fold .shade{position:absolute; inset:0; pointer-events:none; opacity:0; -webkit-backface-visibility:hidden; backface-visibility:hidden; background:linear-gradient(180deg, rgba(31,45,87,.22), rgba(31,45,87,.04))}

/* ---------- S5 cake ---------- */
.cake-stage{position:relative; z-index:4; width:min(92vw,520px); margin-top:14px; transition:filter .7s ease}
.cake-stage.lightsout{filter:brightness(.5) saturate(.75)}
.cake-stage svg.cake{display:block; width:62%; margin:0 auto; overflow:visible}
.cake-stage .cat-in{position:absolute; bottom:0; width:27%}
.cake g{transform-box:fill-box}
.c-plate,.c-bot,.c-top,.c-candle{transform-origin:50% 100%}
.fl-a{transform-origin:50% 100%; animation:flA .37s ease-in-out infinite alternate}
.fl-b{transform-origin:50% 100%; animation:flB .61s ease-in-out infinite alternate}
@keyframes flA{from{transform:scale(1,1)}to{transform:scale(.9,1.09)}}
@keyframes flB{from{transform:skewX(-4deg)}to{transform:skewX(5deg) translateX(.6px)}}
.flame-wrap{transform-origin:50% 100%}
.glow{transform-box:fill-box; transform-origin:center; animation:glowA 2.3s ease-in-out infinite alternate, glowB 3.1s ease-in-out infinite alternate}
@keyframes glowA{from{opacity:.32}to{opacity:.6}}
@keyframes glowB{from{transform:scale(.9)}to{transform:scale(1.1)}}
.out .fl-a,.out .fl-b,.out .glow{animation:none}
.smoke,.breath path{opacity:0}
.dim{position:fixed; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity calc(1.1s / var(--spd)) ease;
  background:radial-gradient(circle at var(--cx,50%) var(--cy,45%), rgba(255,214,140,.12) 0, rgba(15,22,48,.28) 130px, rgba(12,18,40,.74) 440px)}
.dim::after{content:""; position:absolute; inset:0; background:rgba(10,15,35,.55); opacity:0; transition:opacity .7s ease}
.dim.on{opacity:1} .dim.dark::after{opacity:1}
.wish-note{max-width:520px; margin-top:18px; font-family:var(--hand); font-size:clamp(26px,7vw,34px); line-height:1.15; color:var(--navy); transform:rotate(-1deg)}

/* ---------- S6 gift ---------- */
.gift{position:relative; width:min(62vw,260px); aspect-ratio:1/1.02; margin:30px auto 0; cursor:pointer; transform-origin:50% 100%}
.gift .box{position:absolute; left:6%; right:6%; bottom:0; height:66%; border-radius:6px; background:linear-gradient(180deg,#4f7fe0,#2c50a8); box-shadow:inset 0 -10px 0 rgba(0,0,0,.12), 0 16px 30px rgba(31,45,87,.3)}
.gift .box::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%); background:linear-gradient(90deg,#b9c4d4,#f4f7fb 45%,#a7b4c7)}
.gift .box::after{content:""; position:absolute; inset:0; border-radius:6px; background:radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 3px, transparent 4px) 0 0/34px 34px}
.gift .lid{position:absolute; left:0; right:0; top:22%; height:18%; border-radius:6px; background:linear-gradient(180deg,#6b95ea,#3a63c0); box-shadow:0 6px 10px rgba(31,45,87,.25); transform-origin:20% 100%; z-index:2;
  transition:transform calc(1.2s / var(--spd)) cubic-bezier(.2,.9,.3,1.15)}
.gift .lid::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%); background:linear-gradient(90deg,#b9c4d4,#f4f7fb 45%,#a7b4c7)}
.gift .bow{position:absolute; left:50%; bottom:100%; width:62%; transform:translateX(-50%); margin-bottom:-6px}
.gift.idle{animation:shake 4.2s ease-in-out 1.5s infinite}
@keyframes shake{0%,82%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}88%{transform:rotate(4deg)}91%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
.gift.open .lid{transform:translate(22%,-150%) rotate(28deg)}
.gift .rays{position:absolute; left:50%; top:40%; width:240%; aspect-ratio:1; transform:translate(-50%,-50%) scale(.3) rotate(0deg); opacity:0; z-index:-1; pointer-events:none;
  background:repeating-conic-gradient(rgba(156,192,245,.45) 0 9deg, transparent 9deg 22deg); border-radius:50%;
  -webkit-mask:radial-gradient(circle, #000 20%, transparent 68%); mask:radial-gradient(circle, #000 20%, transparent 68%);
  transition:opacity 1.2s ease, transform 2.4s var(--ease)}
.gift.open .rays{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(40deg)}
.gift-msg{max-width:560px; margin-top:24px}
.gift-msg .paper{font-size:clamp(18px,4.8vw,22px); line-height:1.6}
.polaroid.knight{max-width:min(78vw,330px); margin:34px auto 0; cursor:default; --r:-2deg}
.polaroid.knight:hover{transform:rotate(-2deg)}
.polaroid.knight video{display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#dfe6f0; border-radius:2px}
.made{font-family:var(--hand); font-size:clamp(26px,7vw,32px); color:var(--blue); margin-top:22px}

#amb{position:fixed; inset:0; width:100%; height:100%; z-index:8; pointer-events:none}
#fx{position:fixed; inset:0; width:100%; height:100%; z-index:35; pointer-events:none}
#ytHolder{position:fixed; left:-9999px; width:1px; height:1px}

/* ---------- less motion: calm fades, no loops, no 3D ---------- */
.reduced *{animation:none!important}
.reduced .decor{transform:none!important; transition:none}
.reduced .env > .flap,.reduced .env > .card,.reduced .env > .glow-in,.reduced .gift .lid,.reduced .gift .rays{transition-duration:.45s!important; transition-delay:0s!important}
.reduced .polaroid:hover{transform:rotate(var(--r))}
.reduced .peeker{transform:translateY(70%)}
</style>
</head>
<body>

<!-- ================= shared SVG artwork ================= -->

<!-- ================= S1 — the envelope ================= -->
<section class="scene" id="s1" aria-label="Birthday envelope">
  <div class="decor" aria-hidden="true">
    <svg class="sticker" data-r="-12" style="left:4%;top:9%;width:min(18vw,90px)"><use href="#star"/></svg>
    <svg class="sticker" data-r="14" style="right:6%;top:13%;width:min(13vw,64px)"><use href="#star"/></svg>
    <svg class="sticker" data-r="-20" style="left:12%;bottom:11%;width:min(11vw,54px)"><use href="#star"/></svg>
    <svg class="sticker" data-r="8" style="left:8%;bottom:20%;width:min(9vw,44px);fill:var(--pink)"><use href="#heart"/></svg>
    <svg class="sticker" data-r="12" style="right:9%;bottom:15%;width:min(9vw,46px);fill:var(--sky)"><use href="#heart"/></svg>
    <svg class="sticker" data-r="0" style="right:20%;top:6%;width:26px;fill:var(--silver)"><use href="#sparkle"/></svg>
  </div>
  <div class="wrap">
    <div class="env-box">
      <div class="ground" id="ground1"></div>
      <div class="env-stage" id="stage1">
        <div class="env" id="env1" role="button" tabindex="0" aria-label="Open the birthday envelope">
          <svg class="kitty peek" id="peek1" data-paw="1" viewBox="0 0 120 132" style="--fur:#fff;--hat:#3f6fd1"></svg>
          <div class="back"></div>
          <div class="glow-in"></div>
          <div class="card"><span>Happy Birthday!</span></div>
          <div class="front"></div>
          <div class="flap"><i class="f-out"></i><i class="f-in"></i></div>
          <div class="seal"><div class="sh l"><svg viewBox="0 0 100 92"><use href="#heart"/></svg></div><div class="sh r"><svg viewBox="0 0 100 92"><use href="#heart"/></svg></div></div>
          <div class="addr"><b id="envLine1"></b><em id="envLine2"></em></div>
          <svg class="stk sticker" data-r="-14" style="left:-6%;top:-12%;width:22%"><use href="#star"/></svg>
          <svg class="stk sticker" data-r="18" style="right:-4%;bottom:-8%;width:13%"><use href="#star"/></svg>
          <svg class="stk sticker" data-r="-8" style="left:7%;top:30%;width:7%;fill:#f3a9c0"><use href="#heart"/></svg>
          <svg class="stk sticker" data-r="10" style="right:9%;top:42%;width:6%;fill:#9cc0f5"><use href="#heart"/></svg>
        </div>
      </div>
    </div>
    <div id="openRow"><button class="btn" id="openBtn"></button></div>
  </div>
</section>

<!-- ================= S2 — greeting ================= -->
<section class="scene" id="s2" aria-label="Birthday greeting">
  <div class="decor" aria-hidden="true">
    <svg class="bunting" viewBox="0 0 400 90" preserveAspectRatio="none"><path class="wire" d="M0 10 Q200 60 400 10" fill="none" stroke="#8796ad" stroke-width="1.5"/><g id="flags"></g></svg>
    <div class="bal" style="left:-2%;top:16%;width:min(22vw,130px)"><svg viewBox="0 0 100 170" style="--bal:url(#gSilver)"><use href="#balloon"/></svg></div>
    <div class="bal d2" style="left:10%;top:25%;width:min(15vw,90px)"><svg viewBox="0 0 100 170" style="--bal:url(#gBlue)"><use href="#balloon"/></svg></div>
    <div class="bal d3" style="right:-1%;top:14%;width:min(21vw,124px)"><svg viewBox="0 0 100 170" style="--bal:url(#gBlue)"><use href="#balloon"/></svg></div>
    <div class="bal" style="right:11%;top:28%;width:min(13vw,80px)"><svg viewBox="0 0 100 170" style="--bal:url(#gSilver)"><use href="#balloon"/></svg></div>
    <div class="corner-cat" style="left:2%;width:min(30vw,150px)"><svg class="kitty" viewBox="0 0 120 132" style="--fur:#fff;--hat:#3f6fd1"></svg></div>
    <div class="corner-cat" style="right:3%;width:min(26vw,130px)"><svg class="kitty" data-flip="1" viewBox="0 0 120 132" style="--fur:#c9d2df;--hat:#9cc0f5"></svg></div>
  </div>
  <div class="wrap">
    <div class="halo" id="halo2"></div>
    <h1 class="balloon-title" id="greetTitle"></h1>
    <svg class="squiggle" viewBox="0 0 150 14"><path d="M3 8c12-8 18 8 30 0s18 8 30 0 18 8 30 0 18 8 30 0 12 6 24 0" fill="none" stroke="#9cc0f5" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="paper" id="greetCard"><span class="tape"></span><p id="greetText"></p></div>
    <div id="toMemRow"><button class="btn" id="toMemories"></button></div>
  </div>
</section>

<!-- ================= S3 — memory lane ================= -->
<section class="scene" id="s3" aria-label="Our little memory lane">
  <div class="decor" aria-hidden="true">
    <div class="fairy" data-n="15"></div>
    <svg class="sticker" data-r="-10" style="left:3%;top:14%;width:48px"><use href="#star"/></svg>
    <svg class="sticker" data-r="8" style="right:4%;top:12%;width:40px;fill:var(--pink)"><use href="#heart"/></svg>
    <svg class="sticker" data-r="0" style="right:12%;top:22%;width:24px;fill:#9cc0f5"><use href="#sparkle"/></svg>
  </div>
  <div class="wrap">
    <h2 class="h2" id="memTitle"></h2>
    <svg class="squiggle" viewBox="0 0 150 14"><path d="M3 8c12-8 18 8 30 0s18 8 30 0 18 8 30 0 18 8 30 0 12 6 24 0" fill="none" stroke="#9cc0f5" stroke-width="3" stroke-linecap="round"/></svg>
    <p class="hint" id="memHint"></p>
    <div class="gallery" id="gallery"></div>
    <div id="toLetterRow"><button class="btn" id="toLetter"></button></div>
  </div>
</section>

<!-- ================= S4 — the letter ================= -->
<section class="scene" id="s4" aria-label="A birthday letter">
  <div class="decor" aria-hidden="true">
    <div class="fairy" data-n="13"></div>
    <svg class="sticker" data-r="-14" style="left:5%;top:16%;width:56px"><use href="#star"/></svg>
    <div class="bal d3" style="right:5%;top:20%;width:min(16vw,90px)"><svg viewBox="0 0 100 170" style="--bal:url(#gSilver)"><use href="#balloon"/></svg></div>
  </div>
  <div class="veil" id="veil"></div>
  <div class="wrap">
    <div class="env-box" id="box4">
      <div class="ground" id="ground4"></div>
      <div class="env-stage" id="stage4">
        <div class="env wiggle" id="env2" role="button" tabindex="0" aria-label="Open the letter">
          <div class="back"></div>
          <div class="glow-in"></div>
          <div class="card"></div>
          <div class="front"></div>
          <div class="flap"><i class="f-out"></i><i class="f-in"></i></div>
          <div class="seal"><div class="sh l"><svg viewBox="0 0 100 92"><use href="#heart"/></svg></div><div class="sh r"><svg viewBox="0 0 100 92"><use href="#heart"/></svg></div></div>
          <div class="addr"><b id="letterLabel"></b></div>
          <svg class="stk sticker" data-r="16" style="right:-8%;top:-14%;width:22%"><use href="#star"/></svg>
        </div>
      </div>
    </div>
    <p class="hint" id="letterHint"></p>
    <div class="letter-wrap" id="letterWrap" hidden>
      <div class="letter-peek" id="letterPeek"><svg class="kitty" viewBox="0 0 120 132" style="--fur:#c9d2df;--hat:#3f6fd1"></svg></div>
      <div class="letter paper" id="letter"><span class="tape t2"></span>
        <svg class="doodle-heart" viewBox="0 0 100 92" aria-hidden="true"><path d="M50 84C22 64 6 48 8 28 10 12 26 6 38 12c6 3 10 9 12 14 3-8 10-15 20-16 14-1 24 9 22 24-2 20-20 34-42 50z" fill="none" stroke="#3f6fd1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div id="toWishRow" hidden><button class="btn" id="toWish"></button></div>
  </div>
</section>

<!-- ================= S5 — make a wish ================= -->
<section class="scene" id="s5" aria-label="Make a wish">
  <div class="decor" aria-hidden="true">
    <div class="bal" style="left:4%;top:12%;width:min(16vw,90px)"><svg viewBox="0 0 100 170" style="--bal:url(#gBlue)"><use href="#balloon"/></svg></div>
    <div class="bal d2" style="right:4%;top:10%;width:min(18vw,100px)"><svg viewBox="0 0 100 170" style="--bal:url(#gSilver)"><use href="#balloon"/></svg></div>
    <svg class="sticker" data-r="14" style="right:16%;top:30%;width:34px"><use href="#star"/></svg>
  </div>
  <div class="wrap">

<script>
(() => {

/* ================================================================

   ================================================================ */

/* pacing: every duration goes through T(), so animationSpeed in config.js scales the whole show */

const state = { scene: null, run: 0, reduced: false, busy: false, pending: null };
const alive = run => run === state.run;
const EASE = { out: 'cubic-bezier(.22,.9,.28,1)', soft: 'cubic-bezier(.4,0,.2,1)', glide: 'cubic-bezier(.25,.8,.25,1)' };

/* ----------------------------------------------------------------

   can cancel it. Entrances use fill:'backwards' — invisible until their
   turn, then the element's own CSS takes over (hover/idle keep working).
   "Less motion" turns entrances into calm fades (same pacing, no movement).
   ---------------------------------------------------------------- */
function play(el, frames, o = {}) {

  if (el.classList) el.classList.remove('pre');
  const opts = { duration: T(o.duration ?? 900), delay: T(o.delay ?? 0), easing: o.easing || EASE.out, fill: o.fill || 'backwards', id: 'e' };
  if (state.reduced) {

const cancelAnims = root => root.getAnimations({ subtree: true }).forEach(a => { if (a.id === 'e') a.cancel(); });

/* a real damped spring (stiffness from freq, damping ratio zeta), sampled into keyframes */
const springCache = {};
function springCurve(zeta, freq) {
  const key = zeta + '|' + freq;
  if (springCache[key]) return springCache[key];
  const w = 2 * Math.PI * freq, k = w * w, c = 2 * zeta * w, dt = 1 / 240, xs = [0];

  for (let f = 0; f < 600; f++) {
    for (let s = 0; s < 4; s++) { const a = -k * (x - 1) - c * v; v += a * dt; x += v * dt; }
    xs.push(x);
    if (Math.abs(x - 1) < .0015 && Math.abs(v) < .015) { if (++calm > 4) break; } else calm = 0;
  }
  xs[xs.length - 1] = 1;

function springPlay(el, map, o = {}) {
  const { xs, dur } = springCurve(o.zeta ?? .6, o.freq ?? 1.1);
  const n = xs.length - 1, step = Math.max(1, Math.round(n / 70)), frames = [];

const springTime = (o, frac = .3) => springCurve(o.zeta ?? .6, o.freq ?? 1.1).dur * frac;

/* motion paths, generated as keyframes */
function floatDown(dist = 130, swing = 7, sway = 18, turns = 1.25, n = 48) {        // something gently delivered
  const f = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, e = 1 - Math.pow(1 - u, 3), env = Math.pow(1 - u, 1.6), a = u * Math.PI * 2 * turns;

}

  const f = [];

    const u = i / n, e = 1 - Math.pow(1 - u, 2.6), env = 1 - u, a = u * Math.PI * 2.4;
    f.push({ offset: u, opacity: Math.min(1, u * 6), transform: `translate(${(sway * Math.sin(a) * env).toFixed(1)}px,${(dist * (1 - e)).toFixed(1)}px) rotate(${(-6 * Math.cos(a) * env).toFixed(2)}deg)` });
  }

}
function fall(r, r0, sway, from = -160, n = 48) {                                     // a photo fluttering down onto the page
  const f = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, e = 1 - Math.pow(1 - u, 2.3), env = Math.pow(1 - u, 1.5), a = u * Math.PI * 3;
    let y = from * (1 - e); if (u > .84) y -= 5 * Math.sin((u - .84) / .16 * Math.PI);
    f.push({ offset: u, opacity: Math.min(1, u * 5),

      boxShadow: `0 2px 4px rgba(31,45,87,.08), 0 ${(12 + 26 * env).toFixed(1)}px ${(24 + 30 * env).toFixed(1)}px rgba(31,45,87,${(.14 + .08 * env).toFixed(3)})` });

  const f = [{ offset: 0, opacity: 0, transform: `translate(${dx}%,${dy}%) scale(1,1)` }];
  for (let s = 0; s < hops; s++) {
    const a = s / hops, b = (s + 1) / hops, kp = 1 - a, k = 1 - b, height = h * (1 - s * .35);
    f.push({ offset: a + (b - a) * .1, opacity: 1, transform: `translate(${(dx * kp).toFixed(1)}%,${(dy * kp).toFixed(1)}%) scale(.94,1.08)`, easing: 'cubic-bezier(.3,.6,.5,1)' });

function drawLine(path, delay = 0, dur = 900) {

function writeOn(el, delay = 0, dur = 1300) {
  const p = play(el, [{ clipPath: 'inset(-12% 100% -12% 0)' }, { clipPath: 'inset(-12% 0% -12% 0)' }], { duration: dur, delay, easing: 'cubic-bezier(.45,.1,.35,1)' });

    setTimeout(() => {
      if (!alive(run)) return;
      const r = el.getBoundingClientRect(), steps = 7;
      for (let k = 0; k <= steps; k++) setTimeout(() => alive(run) && FX.twinkle(r.left + r.width * k / steps, r.top + r.height * rand(.25, .75), 1, 3), T(dur) * k / steps);

  springPlay(el, (p, u) => {
    const q = Math.min(1, p);

$$('.sticker').forEach(el => { el.style.transform = `rotate(${+(el.dataset.r || 0)}deg)`; });

   ================================================================ */

    <g class="k-ear r"><path d="M91 56 87 26 66 42z" ${F} stroke="${L}" stroke-width="3" stroke-linejoin="round"/><path d="M85 46 84 34 75 41z" fill="#f6b8c9"/></g>

      <circle cx="49" cy="61" r="1.6" fill="#fff"/><circle cx="74" cy="61" r="1.6" fill="#fff"/></g>

      const r = c.getBoundingClientRect(); FX.toss(r.left + r.width / 2, r.top + r.height * .3, i ? 1 : -1);

/* ================================================================
   S3 — memory lane (photos land as they scroll into view)
   ================================================================ */
const toLetterRow = $('#toLetterRow');
let galleryIO = null, dropQ = [], dropBusy = false;

};
leave.s3 = () => { if (galleryIO) galleryIO.disconnect(); };
function dropFrame(f, run) {
  const i = frames.indexOf(f), r = +f.dataset.r, r0 = r + (i % 2 ? 1 : -1) * rand(14, 26);
  play(f, fall(r, r0, rand(26, 44) * (i % 2 ? -1 : 1), -170), { duration: 1500, easing: 'linear' });
  springPlay($('.tape', f), p => ({ opacity: Math.min(1, Math.max(0, p) * 3), transform: `translateX(-50%) translateY(${lerp(-16, 0, p).toFixed(1)}px) rotate(${lerp(-18, -3, p).toFixed(2)}deg) scale(${lerp(1.35, 1, p).toFixed(3)},${(1 - Math.abs(1 - p) * .4).toFixed(3)})` }), { zeta: .5, freq: 1.3, delay: 1150 });
  writeOn($('p', f), 1400, 1100);
  const st = $('.stk', f);
  if (st) { const base = st.style.transform || ''; springPlay(st, p => ({ opacity: Math.min(1, Math.max(0, p) * 3), transform: `${base} scale(${lerp(1.8, 1, p).toFixed(3)})` }), { zeta: .42, freq: 1.4, delay: 1900 }); }

}
function pumpDrops(run) {

}
function startGallery(run) {
  if (galleryIO) galleryIO.disconnect();

}
enter.s3 = (run, b) => {

/* ================================================================
   S4 — the letter (calmer)
   ================================================================ */
const env2 = $('#env2'), stage4 = $('#stage4'), box4 = $('#box4'), letterWrap = $('#letterWrap'), letter = $('#letter'), veil = $('#veil');
(L.paragraphs || []).forEach((t, i, a) => {
  const p = document.createElement('p'); p.textContent = t;

});

reset.s4 = () => {

  $('#letterHint').hidden = false; $('#toWishRow').hidden = true;
};

  $$('#s4 .sticker').forEach((s, i) => placeSticker(s, b + 1600 + i * 230, run));

  fadeUp($('#letterHint'), b + 2500, 12, 1000);
};
// the letter is cut into three slices that unfold in 3D, like a real folded letter
function buildFold() {
  const H = letter.offsetHeight, h1 = Math.round(H / 3), h2 = Math.round(H * 2 / 3);
  const fold = document.createElement('div'); fold.className = 'fold'; fold.setAttribute('aria-hidden', 'true');
  const band = (cls, top, bottom, origin, backTop, backH) => {
    const el = document.createElement('div'); el.className = 'band ' + cls; el.style.transformOrigin = `50% ${origin}px`;
    const face = letter.cloneNode(true); face.removeAttribute('id'); face.classList.add('face'); face.style.visibility = 'visible';
    face.style.clipPath = `inset(${top}px 0 ${bottom}px 0)`;
    const dh = $('.doodle-heart', face); if (dh) dh.style.visibility = 'hidden';
    el.appendChild(face);
    if (backH) { const bk = document.createElement('div'); bk.className = 'back'; Object.assign(bk.style, { top: backTop + 'px', height: backH + 'px' }); el.appendChild(bk); }
    const sh = document.createElement('div'); sh.className = 'shade'; sh.style.clipPath = `inset(${top}px 0 ${bottom}px 0)`; el.appendChild(sh);
    fold.appendChild(el); return el;
  };
  band('mid', h1, H - h2, 0, 0, 0);
  const bot = band('bot', h2, 0, h2, h2, H - h2);
  const top = band('top', 0, H - h1, h1, 0, h1);
  top.style.transform = 'translateZ(2px) rotateX(-180deg)';     // top third folded down in front
  bot.style.transform = 'translateZ(1px) rotateX(180deg)';      // bottom third folded up behind it
  letterWrap.appendChild(fold);
  return { fold, top, bot };
}
async function openLetter() {
  if (opened2 || state.scene !== 's4') return;
  opened2 = true;
  const run = state.run;
  env2.classList.remove('wiggle'); Music.paper();
  play($('#letterHint'), [{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards', keep: true });
  await sealCrack(env2, run);
  if (!alive(run)) return;
  env2.classList.add('open');                          // flap folds back, a soft light, the folded letter slides up
  await wait(2300); if (!alive(run)) return;
  await play(box4, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(60px) scale(.94)' }], { duration: 850, fill: 'forwards', easing: EASE.soft });
  if (!alive(run)) return;
  box4.hidden = true; $('#letterHint').hidden = true; letterWrap.hidden = false; Music.chime();
  const peek = $('#letterPeek'); peek.classList.add('pre');

    await play(letter, [{ opacity: 0 }, { opacity: 1 }], { duration: 650 });
  } else {
    letter.style.visibility = 'hidden';

    if (!alive(run)) return;

      return play(el, [{ transform: `translateZ(${z}px) rotateX(${fromDeg}deg)` }, { transform: `translateZ(${z}px) rotateX(0deg)` }], { duration: 1250, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'forwards', keep: true });
    };
    Music.paper(); await unfold(F.top, -180, 2); if (!alive(run)) return;
    Music.paper(); await unfold(F.bot, 180, 1); if (!alive(run)) return;
    letter.style.visibility = ''; F.fold.remove();
    after = 300;
  }

  drawLine($('.doodle-heart path', letter), after, 1300);

}

/* ================================================================
   S5 — make a wish
   ================================================================ */
const cake = $('#cakeStage'), dim = $('#dim'), blowBtn = $('#blowBtn'), catL = $('#cakeCatL'), catR = $('#cakeCatR'), fw = $('.flame-wrap', cake);
let blown = false;
reset.s5 = () => {

  $('#blowRow').hidden = false; $('#wishNote').hidden = true; $('#toGiftRow').hidden = true;

};

enter.s5 = (run, b) => {
  Amb.mood(.85);
  springPlay($('#wishTitle'), (p, u) => ({ opacity: Math.min(1, u * 4), transform: `translateY(${lerp(-26, 0, p).toFixed(1)}px) scale(${lerp(.82, 1, p).toFixed(3)})` }), { zeta: .5, freq: .95, delay: b });
  drawLine($('#s5 .squiggle path'), b + 600, 1000);

  }, Object.assign({ delay: b + 600 + i * 380 }, o)));

enter.s6 = (run, b) => {
