<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fd">
<title>Happy Birthday 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --navy:#1f2d57; --ink:#2a3768; --blue:#3f6fd1; --sky:#9cc0f5; --ice:#e7effc; --silver:#c9d2df;
  --paper:#fdfdff; --bg:#f4f7fd; --line:#d7e2f5; --pink:#f3a9c0;
  --hand:'Caveat',cursive; --round:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:var(--body); color:var(--ink); overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg);
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.polaroid:focus-visible,.env:focus-visible,.gift:focus-visible{outline:3px dashed var(--blue);outline-offset:6px;border-radius:14px}
svg.defs{position:absolute;width:0;height:0}

/* ---------- scenes ---------- */
.scene{
  position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
  opacity:0; visibility:hidden; transform:translateY(26px) scale(.985); filter:blur(4px);
  transition:opacity .75s ease, transform .95s var(--ease), filter .8s ease, visibility 0s linear .95s;
}
.scene.active{opacity:1; visibility:visible; transform:none; filter:none; transition-delay:0s}
.wrap{position:relative; z-index:2; min-height:100%; max-width:760px; margin:0 auto; padding:84px 20px 72px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.decor{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden}
.decor > *{position:absolute}

/* reveal-on-enter */
.rv{opacity:0; transform:translateY(16px); transition:opacity .7s ease, transform .8s var(--ease)}
.rv.on{opacity:1; transform:none}

/* ---------- shared bits ---------- */
.btn{
  display:inline-flex; align-items:center; gap:.5em; margin-top:26px; padding:15px 26px; border-radius:999px;
  font-family:var(--round); font-weight:600; font-size:clamp(16px,4.3vw,19px); letter-spacing:.2px; color:#fff;
  background:linear-gradient(180deg,#5a87e3,#2f58b8); box-shadow:0 6px 0 #22448f, 0 12px 26px rgba(40,70,150,.28);
  transition:transform .15s ease, box-shadow .15s ease, opacity .5s ease;
}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #22448f, 0 6px 14px rgba(40,70,150,.25)}
.btn.ghost{background:#fff; color:var(--navy); box-shadow:0 5px 0 var(--silver), 0 10px 20px rgba(40,70,150,.12); border:2px solid var(--silver)}
.btn[disabled]{opacity:.45; pointer-events:none}
.paper{
  position:relative; background:var(--paper); border-radius:6px; padding:26px 24px;
  box-shadow:0 1px 0 rgba(31,45,87,.06), 0 14px 34px rgba(31,45,87,.12);
}
.tape{position:absolute; width:96px; height:28px; top:-13px; left:50%; transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(90deg, rgba(156,192,245,.75) 0 8px, rgba(190,214,250,.75) 8px 16px); box-shadow:0 1px 2px rgba(0,0,0,.08); opacity:.95}
.tape.t2{background:repeating-linear-gradient(45deg, rgba(201,210,223,.85) 0 6px, rgba(235,240,247,.85) 6px 12px)}
.hand{font-family:var(--hand)}
/* denim-patch headings: twill fill, white edge, navy outline */
.h2{font-family:var(--round); font-weight:700; font-size:clamp(32px,9vw,50px); line-height:1.08; letter-spacing:.5px;
  background:repeating-linear-gradient(55deg,#4a72bd 0 2px,#3a5fa6 2px 4px,#5a82c9 4px 5px); -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:1.5px #fff; filter:drop-shadow(0 0 0 #1f2d57) drop-shadow(1.5px 0 0 #1f2d57) drop-shadow(-1.5px 0 0 #1f2d57) drop-shadow(0 1.5px 0 #1f2d57) drop-shadow(0 -1.5px 0 #1f2d57) drop-shadow(0 6px 8px rgba(31,45,87,.22))}
.hint{font-family:var(--hand); font-size:22px; color:#5c6c9c; margin-top:10px}
.squiggle{display:block; margin:10px auto 0; width:150px; height:14px}

/* silver balloon lettering */
.balloon-title{font-family:var(--round); font-weight:700; line-height:1.02; font-size:clamp(46px,13.5vw,96px); letter-spacing:.5px; filter:drop-shadow(0 3px 0 #9aa8bd) drop-shadow(0 10px 16px rgba(31,45,87,.22))}
.balloon-title .w{display:inline-block; white-space:nowrap; margin:0 .14em}
.balloon-title .l{
  display:inline-block; position:relative;
  background:linear-gradient(180deg,#ffffff 0%,#dfe5ee 16%,#8d9aae 44%,#f4f7fa 58%,#6f7c92 84%,#c3ccd8 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:2px #5f6c82;
  animation:bob 3.2s ease-in-out infinite; animation-delay:calc(var(--i) * -.23s);
}
.balloon-title .w.blue .l{background-image:linear-gradient(180deg,#e6f0ff 0%,#9cc0f5 26%,#3f6fd1 55%,#9cc0f5 72%,#2f58b8 100%); -webkit-text-stroke-color:#2b4f9e}
@keyframes bob{0%,100%{transform:translateY(0) rotate(calc(var(--r) * 1deg))}50%{transform:translateY(-6px) rotate(calc(var(--r) * -1deg))}}

/* floating decorations */
.float{animation:float 6s ease-in-out infinite}
.float.d2{animation-duration:7.5s; animation-delay:-2s} .float.d3{animation-duration:5.2s; animation-delay:-3.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--rot,0deg) + 3deg))}}
.spin{animation:spin 14s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

/* ---------- HUD ---------- */
.hud{position:fixed; top:max(12px, env(safe-area-inset-top)); z-index:30; display:flex; gap:8px}
.hud.left{left:12px} .hud.right{right:12px}
.pill{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.88); border:1.5px solid var(--silver);
  font-family:var(--round); font-weight:600; font-size:14px; color:var(--navy); box-shadow:0 4px 12px rgba(31,45,87,.1); backdrop-filter:blur(6px)}
.pill svg{width:16px; height:16px}
#musicBtn .pause{display:none} #musicBtn.playing .play{display:none} #musicBtn.playing .pause{display:inline}
#motionBtn .dot{width:10px; height:10px; border-radius:50%; border:2px solid var(--navy)}
#motionBtn[aria-pressed="true"] .dot{background:var(--navy)}
.dots{position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom)); z-index:30; display:flex; gap:8px}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--silver); transition:all .4s ease}
.dots i.on{width:22px; border-radius:6px; background:var(--blue)}
@media (max-width:420px){ .pill .lbl{display:none} .pill{padding:9px 11px} }

/* ---------- envelope (scenes 1 and 4) ---------- */
.env{position:relative; width:min(88vw,430px); aspect-ratio:1.42; margin:8px auto 0; perspective:1200px; cursor:pointer}
.env .back,.env .front,.env .flap,.env .card{position:absolute; left:0; width:100%}
.env .back{inset:0; height:100%; border-radius:10px; background:linear-gradient(160deg,#cfe0fb,#a9c6f3); box-shadow:0 18px 40px rgba(31,45,87,.22)}
.env .card{left:6%; width:88%; top:8%; height:84%; border-radius:6px; background:var(--paper); box-shadow:0 2px 6px rgba(0,0,0,.08);
  display:flex; align-items:flex-start; justify-content:center; padding-top:9%; transition:transform 1s var(--ease) .35s; z-index:1}
.env .card span{font-family:var(--round); font-weight:700; font-size:clamp(18px,5vw,26px); color:var(--blue)}
.env .front{bottom:0; height:100%; z-index:2; border-radius:10px; overflow:hidden; pointer-events:none}
.env .front::before{content:""; position:absolute; inset:0; background:linear-gradient(170deg,#e3edfd,#bcd3f7);
  clip-path:polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%)}
.env .front::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(31,45,87,.07), transparent 40%);
  clip-path:polygon(0 100%, 50% 50%, 100% 100%)}
.env .flap{top:0; height:58%; z-index:3; transform-origin:50% 0; transition:transform .9s var(--ease), z-index 0s .45s; transform-style:preserve-3d}
.env .flap::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg,#d7e5fc,#b3cdf5); clip-path:polygon(0 0,100% 0,50% 100%); filter:drop-shadow(0 3px 2px rgba(31,45,87,.18))}
.env .seal{position:absolute; left:50%; top:100%; width:58px; height:58px; transform:translate(-50%,-62%); border-radius:50%; z-index:4;
  background:radial-gradient(circle at 35% 30%,#ffffff,#d3dbe7 45%,#9aa8bd); box-shadow:0 3px 8px rgba(31,45,87,.3), inset 0 0 0 3px rgba(255,255,255,.5);
  display:grid; place-items:center; transition:opacity .4s ease}
.env .seal svg{width:28px; height:28px}
.env .addr{position:absolute; z-index:3; left:0; right:0; bottom:9%; padding:0 10%; font-family:var(--hand); color:var(--navy); line-height:1.1; pointer-events:none}
.env .addr b{display:block; font-size:clamp(24px,6.6vw,34px); font-weight:700}
.env .addr em{display:block; font-style:normal; font-size:clamp(19px,5vw,25px); color:#45579a}
.env .stk{position:absolute; z-index:4; pointer-events:none}
.env.open .flap{transform:rotateX(180deg); z-index:0}
.env.open .seal{opacity:0}
.env.open .card{transform:translateY(-46%)}
.env:not(.open):hover .flap{transform:rotateX(14deg)}
.env.wiggle{animation:wiggle 3.6s ease-in-out infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-2.2deg)}93%{transform:rotate(2deg)}97%{transform:rotate(-1deg)}}
.env-note{max-width:440px; margin-top:28px}

/* ---------- scene 2 ---------- */
.bunting{position:absolute; top:0; left:-2%; width:104%; height:90px; z-index:1}
#s2 .paper{max-width:600px; margin-top:24px; font-size:clamp(16.5px,4.3vw,19px); line-height:1.7; text-align:left}

/* ---------- scene 3: gallery ---------- */
.gallery{display:grid; grid-template-columns:repeat(2,1fr); gap:30px 18px; width:100%; margin-top:30px; padding:0 4px}
@media (min-width:720px){ .gallery{grid-template-columns:repeat(3,1fr); gap:38px 26px} }
.polaroid{position:relative; background:#fff; padding:9px 9px 0; border-radius:3px; cursor:pointer; transform:rotate(var(--r));
  box-shadow:0 2px 4px rgba(31,45,87,.08), 0 12px 24px rgba(31,45,87,.14); transition:transform .35s var(--ease), box-shadow .35s ease}
.polaroid:hover{transform:rotate(0deg) translateY(-4px) scale(1.03); box-shadow:0 18px 34px rgba(31,45,87,.2); z-index:3}
.polaroid .ph{aspect-ratio:1; background:var(--ice) center/cover no-repeat; border-radius:2px; overflow:hidden; display:grid; place-items:center}
.polaroid .ph.empty{background:repeating-linear-gradient(135deg,#eef4fe 0 12px,#e4edfc 12px 24px)}
.polaroid .ph.empty div{font-family:var(--hand); color:#6f80b0; font-size:19px; line-height:1}
.polaroid .ph.empty svg{width:46%; height:auto; display:block; margin:0 auto 4px}
.polaroid p{font-family:var(--hand); font-size:clamp(17px,4.6vw,21px); line-height:1.05; color:var(--navy); padding:9px 2px 12px; min-height:3.2em; display:flex; align-items:center; justify-content:center}
.polaroid .tape{width:70px; height:22px; top:-10px}
.polaroid .stk{position:absolute; width:44px; height:44px; pointer-events:none}

/* lightbox */
.lb{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:20px; background:rgba(22,32,64,.62); backdrop-filter:blur(6px);
  opacity:0; visibility:hidden; transition:opacity .35s ease, visibility 0s .35s}
.lb.on{opacity:1; visibility:visible; transition-delay:0s}
.lb-card{background:#fff; padding:12px 12px 0; border-radius:4px; box-shadow:0 30px 60px rgba(0,0,0,.35); max-width:min(92vw,560px); transform:scale(.94) rotate(-1deg); transition:transform .45s var(--ease)}
.lb.on .lb-card{transform:none}
.lb-img{display:block; max-width:100%; max-height:66vh; margin:0 auto; border-radius:2px}
.lb-card p{font-family:var(--hand); font-size:clamp(22px,6vw,28px); color:var(--navy); text-align:center; padding:12px 6px 14px}
.lb-nav{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px}
.lb-nav button{width:46px; height:46px; border-radius:50%; background:#fff; color:var(--navy); font-size:22px; box-shadow:0 6px 14px rgba(0,0,0,.2)}
.lb-nav span{color:#fff; font-family:var(--round); font-weight:600; min-width:56px; text-align:center}
.lb-close{position:absolute; top:max(14px, env(safe-area-inset-top)); right:14px; width:46px; height:46px; border-radius:50%; background:#fff; color:var(--navy); font-size:22px; box-shadow:0 6px 14px rgba(0,0,0,.2)}

/* ---------- scene 4: letter ---------- */
#s4 .env{width:min(78vw,360px)}
#s4 .env .back{background:linear-gradient(160deg,#2f4f99,#1f2d57)}
#s4 .env .front::before{background:linear-gradient(170deg,#3d62b5,#26407e)}
#s4 .env .flap::before{background:linear-gradient(180deg,#4a70c2,#2c4b92)}
#s4 .env .addr{color:#fff; bottom:12%} #s4 .env .addr b{font-size:clamp(26px,7vw,34px)}
.env.away{transform:translateY(30px) scale(.9); opacity:0; transition:transform .7s var(--ease), opacity .6s ease}
.letter{display:none; width:100%; max-width:600px; margin-top:4px; text-align:left;
  background:linear-gradient(transparent 31px, #dfe8f8 32px) 0 14px/100% 32px, var(--paper);
  padding:34px 26px 30px 36px; font-family:var(--hand); font-size:clamp(22px,5.8vw,27px); line-height:32px; color:var(--navy);
  border-left:3px double #f2b8c9; transform-origin:50% 0}
.letter.show{display:block; animation:unfold .9s var(--ease) both}
@keyframes unfold{from{opacity:0; transform:perspective(900px) rotateX(-28deg) translateY(-10px)}to{opacity:1; transform:none}}
.letter p{margin-bottom:16px; opacity:0; transform:translateY(8px); transition:opacity .8s ease, transform .8s var(--ease)}
.letter p.on{opacity:1; transform:none}
.letter p.greet{font-size:1.25em; font-weight:700; color:var(--blue)}
.letter p.closing{font-weight:700}

/* ---------- scene 5: cake ---------- */
.cake-stage{position:relative; width:min(92vw,520px); margin-top:14px}
.cake-stage svg.cake{display:block; width:62%; margin:0 auto}
.cake-stage .cat{position:absolute; bottom:0; width:27%}
.flame{transform-origin:150px 72px; animation:flick .14s ease-in-out infinite alternate; transition:transform .5s ease, opacity .5s ease}
@keyframes flick{from{transform:scale(1,1) skewX(-2deg)}to{transform:scale(.94,1.06) skewX(2deg)}}
.out .flame{animation:none; transform:scale(0,.2); opacity:0}
.glow{transition:opacity .6s ease} .out .glow{opacity:0}
.smoke{opacity:0} .out .smoke{animation:smoke 2.6s ease-out .1s forwards}
.out .smoke.b{animation-delay:.35s} .out .smoke.c{animation-delay:.6s}
@keyframes smoke{0%{opacity:0; transform:translate(0,0) scale(.6)}15%{opacity:.7}100%{opacity:0; transform:translate(10px,-70px) scale(1.8)}}
.wish-note{max-width:520px; margin-top:18px; font-family:var(--hand); font-size:clamp(26px,7vw,34px); line-height:1.15; color:var(--navy); display:none}
.wish-note.show{display:block; animation:pop .7s var(--ease) both}
@keyframes pop{from{opacity:0; transform:scale(.8) rotate(-3deg)}to{opacity:1; transform:rotate(-1deg)}}

/* ---------- scene 6: gift ---------- */
.gift{position:relative; width:min(62vw,260px); aspect-ratio:1/1.02; margin:30px auto 0; cursor:pointer}
.gift .box{position:absolute; left:6%; right:6%; bottom:0; height:66%; border-radius:6px; background:linear-gradient(180deg,#4f7fe0,#2c50a8); box-shadow:inset 0 -10px 0 rgba(0,0,0,.12), 0 16px 30px rgba(31,45,87,.3)}
.gift .box::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%); background:linear-gradient(90deg,#b9c4d4,#f4f7fb 45%,#a7b4c7)}
.gift .box::after{content:""; position:absolute; inset:0; border-radius:6px; background:radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 3px, transparent 4px) 0 0/34px 34px}
.gift .lid{position:absolute; left:0; right:0; top:22%; height:18%; border-radius:6px; background:linear-gradient(180deg,#6b95ea,#3a63c0); box-shadow:0 6px 10px rgba(31,45,87,.25); transition:transform .9s var(--ease); transform-origin:20% 100%; z-index:2}
.gift .lid::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%); background:linear-gradient(90deg,#b9c4d4,#f4f7fb 45%,#a7b4c7)}
.gift .bow{position:absolute; left:50%; bottom:100%; width:62%; transform:translateX(-50%); margin-bottom:-6px}
.gift.idle{animation:shake 3s ease-in-out infinite}
@keyframes shake{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-4deg)}88%{transform:rotate(4deg)}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}
.gift.open .lid{transform:translate(18%,-130%) rotate(24deg)}
.gift .rays{position:absolute; left:50%; top:40%; width:220%; aspect-ratio:1; transform:translate(-50%,-50%) scale(.3); opacity:0; z-index:-1; pointer-events:none;
  background:repeating-conic-gradient(rgba(156,192,245,.45) 0 9deg, transparent 9deg 22deg); border-radius:50%;
  -webkit-mask:radial-gradient(circle, #000 20%, transparent 68%); mask:radial-gradient(circle, #000 20%, transparent 68%); transition:opacity .8s ease, transform 1.2s var(--ease)}
.gift.open .rays{opacity:1; transform:translate(-50%,-50%) scale(1)}
.gift-msg{display:none; max-width:560px; margin-top:24px}
.gift-msg.show{display:block; animation:pop .8s var(--ease) both}
.gift-msg .paper{font-size:clamp(18px,4.8vw,22px); line-height:1.6}
.polaroid.knight{max-width:min(78vw,330px); margin:34px auto 0; cursor:default; --r:-2deg}
.polaroid.knight:hover{transform:rotate(-2deg)}
.polaroid.knight video{display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#dfe6f0; border-radius:2px}
.made{font-family:var(--hand); font-size:clamp(26px,7vw,32px); color:var(--blue); margin-top:22px}

/* canvas */
#fx{position:fixed; inset:0; width:100%; height:100%; z-index:35; pointer-events:none}
#ytHolder{position:fixed; left:-9999px; width:1px; height:1px}

/* ---------- reduced motion ---------- */
.reduced .scene{transform:none!important; filter:none!important}
.reduced .float,.reduced .spin,.reduced .balloon-title .l,.reduced .env.wiggle,.reduced .gift.idle,.reduced .flame{animation:none!important}
.reduced .rv{transform:none}
@media (prefers-reduced-motion: reduce){ .scene{transition-duration:.3s} }
</style>
</head>
<body>

<!-- ================= shared SVG artwork ================= -->
<svg class="defs" aria-hidden="true">
  <defs>
    <linearGradient id="gSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d9e0ea"/><stop offset=".55" stop-color="#a9b5c7"/><stop offset=".75" stop-color="#eef2f8"/><stop offset="1" stop-color="#9aa8bd"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6e6ff"/><stop offset=".35" stop-color="#7fa8f0"/><stop offset=".6" stop-color="#2f58b8"/><stop offset=".8" stop-color="#8db4f4"/><stop offset="1" stop-color="#24478f"/>
    </linearGradient>
    <linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c7fc9"/><stop offset=".45" stop-color="#1f2d57"/><stop offset=".7" stop-color="#3b56a0"/><stop offset="1" stop-color="#141d3d"/>
    </linearGradient>
    <pattern id="denim" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="5" height="5" fill="#3a5fa6"/><rect width="2.2" height="5" fill="#4b72bd"/><rect x="3.4" width=".6" height="5" fill="#2e4f8f"/>
    </pattern>
  </defs>

  <!-- cat with a party hat; colours come from --fur / --hat on the <use> -->
  <symbol id="cat" viewBox="0 0 120 132">
    <path d="M88 116c20 3 28-12 22-24-4-8-13-7-12 1" fill="none" stroke="#1f2d57" stroke-width="10" stroke-linecap="round"/>
    <path d="M88 116c20 3 28-12 22-24-4-8-13-7-12 1" fill="none" style="stroke:var(--fur,#fff)" stroke-width="5.5" stroke-linecap="round"/>

<script>
(() => {
'use strict';

/* ================================================================
   config + helpers
   ================================================================ */
const C = window.BIRTHDAY || {};
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const txt = (sel, v) => { const el = $(sel); if (el) el.textContent = v || ''; return el; };
if (C.pageTitle) document.title = C.pageTitle;

const state = { scene: null, run: 0, reduced: false };
const alive = run => run === state.run;
const M = ms => state.reduced ? ms * .5 : ms;

/* ================================================================
   reduced motion (saved choice, else the device setting)
   ================================================================ */
const motionBtn = $('#motionBtn');
function applyMotion() {
  document.documentElement.classList.toggle('reduced', state.reduced);
  motionBtn.setAttribute('aria-pressed', String(state.reduced));
}
const savedMotion = store.get('bday-reduced');
state.reduced = savedMotion == null ? matchMedia('(prefers-reduced-motion: reduce)').matches : savedMotion === '1';
applyMotion();
motionBtn.addEventListener('click', () => { state.reduced = !state.reduced; store.set('bday-reduced', state.reduced ? '1' : '0'); applyMotion(); });

/* ================================================================
   confetti: blue / navy / silver / white pieces, stars and hearts
   ================================================================ */
function sprite(size, draw) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); return c; }
const COLORS = ['#3f6fd1', '#1f2d57', '#9cc0f5', '#c9d2df', '#ffffff', '#5a87e3'];
const starSprite = col => sprite(64, (x, S) => {
  x.translate(S / 2, S / 2); x.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? S * .19 : S * .44; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  x.closePath(); x.fillStyle = col; x.fill(); x.strokeStyle = 'rgba(31,45,87,.35)'; x.lineWidth = 2; x.stroke();
});
const heartSprite = col => sprite(64, (x, S) => {
  const p = new Path2D('M50 88C20 66 2 48 2 28 2 13 13 3 27 3c10 0 18 6 23 15C55 9 63 3 73 3c14 0 25 10 25 25 0 20-18 38-48 60z');
  x.scale(S / 100, S / 100); x.translate(0, 4); x.fillStyle = col; x.fill(p);
});
const STARS = ['#c9d2df', '#3f6fd1', '#9cc0f5'].map(starSprite);
const HEARTS = ['#9cc0f5', '#c9d2df', '#3f6fd1'].map(heartSprite);

const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W, H, dpr, P = [], running = false, last = 0;
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.life += dt;
      if (p.life > p.max || p.y > H + 60) { P.splice(i, 1); continue; }
      p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
      p.x += (p.vx + Math.sin(p.life * p.sw + p.ph) * p.swA) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const u = p.life / p.max, a = u > .75 ? (1 - u) / .25 : 1;
      ctx.globalAlpha = a;
      ctx.setTransform(dpr * Math.cos(p.rot), dpr * Math.sin(p.rot), -dpr * Math.sin(p.rot), dpr * Math.cos(p.rot), dpr * p.x, dpr * p.y);
      if (p.img) ctx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
      else { const fl = Math.cos(p.life * p.flip + p.ph); ctx.scale(1, fl); ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size * .3, p.size, p.size * .6); }
    }
    ctx.globalAlpha = 1;
    if (P.length) requestAnimationFrame(loop); else { running = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  function add(p) {
    P.push(Object.assign({ life: 0, rot: rand(0, 6.3), vr: rand(-5, 5), drag: .5, g: 520, sw: rand(2, 5), swA: rand(10, 40), ph: rand(0, 6.3), flip: rand(5, 12), max: rand(2.4, 4) }, p));
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
  }
  return {
    resize,
    burst(x, y, n = 140, spread = 1) {
      n = Math.round(n * (state.reduced ? .3 : 1));
      for (let i = 0; i < n; i++) {
        const ang = -Math.PI / 2 + rand(-1.25, 1.25) * spread, sp = rand(360, 1050);
        const kind = Math.random();
        add({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, drag: .12,
          img: kind < .14 ? pick(STARS) : kind < .24 ? pick(HEARTS) : null, col: pick(COLORS), size: kind < .24 ? rand(16, 28) : rand(8, 14) });
      }
    },
    rain(n = 90) {
      n = Math.round(n * (state.reduced ? .3 : 1));
      for (let i = 0; i < n; i++) add({ x: rand(0, W), y: rand(-H * .5, -20), vx: rand(-30, 30), vy: rand(40, 140), g: 60, drag: .9, max: rand(4, 7),
        img: Math.random() < .2 ? pick(STARS) : null, col: pick(COLORS), size: rand(8, 15) });
    },
  };
})();
FX.resize();

/* ================================================================
   music: never automatic — only the Play button starts it.
   YouTube link, or a file, or a built-in music-box "Happy Birthday".
   Sound effects only play while music is switched on.
   ================================================================ */
const Music = (() => {
  const cfg = Object.assign({ youtube: '', src: '', volume: .8 }, C.music || {});
  const btn = $('#musicBtn'), lbl = $('#musicLbl');
  const ytId = (v => { const m = String(v || '').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(v) ? v : ''); })(cfg.youtube);
  const canYT = !!ytId && /^https?:$/.test(location.protocol);
  let on = false, ctx = null, master, bus, verb, timer = null, el = null, yt = null, ytReady = false, mode = '';
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function ui() {
    btn.classList.toggle('playing', on);
    lbl.textContent = on ? 'Pause music' : 'Play music';
    btn.setAttribute('aria-label', on ? 'Pause music' : 'Play music');
  }
  function audio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    verb = ctx.createConvolver();
    const len = ctx.sampleRate * 2.4, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = b; const wet = ctx.createGain(); wet.gain.value = .35; verb.connect(wet); wet.connect(master);
    bus = ctx.createGain(); bus.gain.value = 0; bus.connect(master); bus.connect(verb);
  }
  // music-box note: bright sine + a slightly inharmonic overtone, quick decay
  function tine(m, t, v, dest = bus) {
    const f = mtof(m), g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);
    [[1, 1], [2.0, .28], [4.2, .1]].forEach(([k, a]) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * k;
      const og = ctx.createGain(); og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.9);
    });
    g.connect(dest);
  }
  // Happy Birthday (traditional, public domain) — [midi, beat, length]
  const MEL = [[67,0],[67,.75],[69,1],[67,2],[72,3],[71,4],
               [67,6],[67,6.75],[69,7],[67,8],[74,9],[72,10],
               [67,12],[67,12.75],[79,13],[76,14],[72,15],[71,16],[69,17],
               [77,19],[77,19.75],[76,20],[72,21],[74,22],[72,23]];
  const CH = [[1,[48,52,55]],[4,[43,50,53]],[7,[43,50,53]],[10,[48,52,55]],[13,[48,52,55]],[16,[41,48,53]],[20,[48,52,55]],[22,[43,50,53]],[23,[48,52,55]]];
  const LOOP = 28, BEAT = .62;
  function startBox() {
    let t0 = ctx.currentTime + .2;
    const schedule = () => {
      MEL.forEach(([m, b]) => tine(m + 12, t0 + b * BEAT, .16));
      CH.forEach(([b, ns]) => ns.forEach((m, i) => tine(m + 12, t0 + b * BEAT + i * .03, .05)));
      t0 += LOOP * BEAT;
    };
    schedule();
    timer = setInterval(() => { if (t0 - ctx.currentTime < 3) schedule(); }, 500);
    mode = 'box';
  }
  function play() {
    audio();
    if (ctx) { master.gain.setTargetAtTime(1, ctx.currentTime, .05); bus.gain.setTargetAtTime(clamp(cfg.volume, 0, 1), ctx.currentTime, .4); }
    if (canYT) {
      if (yt && ytReady) { yt.setVolume(Math.round(clamp(cfg.volume, 0, 1) * 100)); yt.playVideo(); mode = 'yt'; return; }
      if (!yt) loadYT();
      return;
    }
    if (cfg.src) {
      if (!el) { el = new Audio(cfg.src); el.loop = true; }
      el.volume = clamp(cfg.volume, 0, 1);
      el.play().then(() => { mode = 'file'; }).catch(() => { el = null; if (!timer && ctx) startBox(); });
      return;
    }
    if (!timer && ctx) startBox();
  }
  function pause() {
    if (yt && ytReady) try { yt.pauseVideo(); } catch (e) {}
    if (el) el.pause();
    if (ctx) bus.gain.setTargetAtTime(0, ctx.currentTime, .15);
  }
  function loadYT() {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('ytHolder', { videoId: ytId, width: 200, height: 200,
        playerVars: { autoplay: 0, controls: 0, playsinline: 1, loop: 1, playlist: ytId, rel: 0 },
        events: {
          onReady() { ytReady = true; if (on) { yt.setVolume(Math.round(clamp(cfg.volume, 0, 1) * 100)); yt.playVideo(); mode = 'yt'; } },
          onError() { if (on && ctx && !timer) startBox(); },
        } });
    };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { if (on && ctx && !timer) startBox(); };
    document.head.appendChild(s);
  }
  btn.addEventListener('click', () => { on = !on; if (on) play(); else pause(); ui(); });
  document.addEventListener('visibilitychange', () => { if (!on) return; if (document.hidden) { if (ctx) ctx.suspend(); if (el) el.pause(); } else { if (ctx) ctx.resume(); if (el) el.play().catch(() => {}); } });
  ui();

  // little effects (silent unless the music is on)
  function sfx(fn) { if (!on) return; audio(); if (ctx) fn(ctx.currentTime + .01); }
  function noise(t, dur, f1, f2, v) {
    const len = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = ctx.createBufferSource(); s.buffer = b; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .8;
    bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain(); g.gain.value = v; s.connect(bp); bp.connect(g); g.connect(master); s.start(t);
  }
  return {
    paper: () => sfx(t => noise(t, .5, 3000, 900, .12)),
    chime: () => sfx(t => [84, 88, 91, 96].forEach((m, i) => tine(m, t + i * .09, .12, master))),
    pop: () => sfx(t => { noise(t, .35, 2000, 500, .25); [79, 84, 88, 91, 96].forEach((m, i) => tine(m, t + .05 + i * .07, .1, master)); }),
    blow: () => sfx(t => noise(t, .9, 700, 300, .35)),
  };
})();

/* ================================================================
   fill in the text from config.js
   ================================================================ */
const E = C.envelope || {}, G = C.greeting || {}, MEM = C.memories || {}, L = C.letter || {}, WSH = C.wish || {}, GF = C.gift || {};
txt('#envLine1', E.line1); txt('#envLine2', E.line2); txt('#openBtn', E.button);
txt('#greetText', G.text); txt('#toMemories', G.button);
txt('#memTitle', MEM.title); txt('#memHint', MEM.hint); txt('#toLetter', MEM.button);
txt('#letterLabel', L.label); txt('#letterHint', L.hint); txt('#toWish', L.button);
txt('#wishTitle', WSH.title); txt('#blowBtn', WSH.button); txt('#wishNote', WSH.after); txt('#toGift', WSH.next);
txt('#giftTitle', GF.title); txt('#giftHint', GF.hint); txt('#giftText', GF.message); txt('#madeLine', GF.footer); txt('#replay', GF.replay);

// balloon lettering: one span per letter, words kept together; the last word in blue
(() => {
  const h = $('#greetTitle'), words = String(G.title || 'Happy Birthday!').split(' ');
  h.setAttribute('aria-label', G.title || '');
  let i = 0;
  words.forEach((w, wi) => {
    const ws = document.createElement('span'); ws.className = 'w' + (wi === words.length - 1 ? ' blue' : ''); ws.setAttribute('aria-hidden', 'true');
    for (const ch of w) { const s = document.createElement('span'); s.className = 'l'; s.textContent = ch; s.style.setProperty('--i', i); s.style.setProperty('--r', ((i * 37) % 7) - 3); ws.appendChild(s); i++; }
    h.appendChild(ws); h.appendChild(document.createTextNode(' '));
  });
})();
// bunting flags along the curve
(() => {
  const g = $('#flags'), cols = ['#1f2d57', '#c9d2df', '#3f6fd1', '#ffffff', '#9cc0f5'];
  for (let i = 0; i < 17; i++) {
    const u = (i + .5) / 17, x = u * 400, y = 10 + 50 * 4 * u * (1 - u) * .5 * 2 * .5;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', `M${x - 10} ${y} L${x + 10} ${y} L${x} ${y + 26} Z`);
    p.setAttribute('fill', cols[i % cols.length]); p.setAttribute('stroke', '#8796ad'); p.setAttribute('stroke-width', '1');
    g.appendChild(p);
  }
})();

/* ================================================================
   photos: polaroids + placeholders
   ================================================================ */
const PH_ICON = '<svg viewBox="0 0 120 132" style="--fur:#fff;--hat:#9cc0f5"><use href="#cat"/></svg>';
const photos = (C.photos && C.photos.length ? C.photos : [{}, {}, {}, {}, {}, {}]).map((p, i) => ({ src: p.src || '', caption: p.caption || '', i, ok: false }));
function placeholderURL(p) {
  const c = document.createElement('canvas'); c.width = 900; c.height = 900; const x = c.getContext('2d');
  for (let k = -900; k < 900; k += 34) { x.fillStyle = (k / 34) % 2 ? '#eef4fe' : '#e4edfc'; x.beginPath(); x.moveTo(k, 0); x.lineTo(k + 17, 0); x.lineTo(k + 917, 900); x.lineTo(k + 900, 900); x.fill(); }
  x.fillStyle = '#6f80b0'; x.textAlign = 'center'; x.font = '700 64px Caveat, cursive'; x.fillText('your photo here', 450, 430);
  x.font = '500 40px Caveat, cursive'; x.fillText(p.src ? p.src + ' (not found)' : 'photo ' + (p.i + 1), 450, 500);
  return c.toDataURL('image/png');
}
const STICKERS = [
  '<svg class="stk" style="right:-14px;top:-14px;transform:rotate(14deg)"><use href="#star"/></svg>',
  '<svg class="stk" style="left:-18px;top:-30px;--fur:#c9d2df;--hat:#3f6fd1;width:50px;height:54px" viewBox="0 0 120 132"><use href="#cat"/></svg>',
  '<svg class="stk" style="right:-10px;top:-10px;fill:#f3a9c0;width:30px;height:30px"><use href="#heart"/></svg>',
  '', '<svg class="stk" style="left:-12px;top:-12px;fill:#9cc0f5;width:26px;height:26px"><use href="#sparkle"/></svg>',
  '<svg class="stk" style="right:-18px;top:-30px;--fur:#fff;--hat:#9cc0f5;width:50px;height:54px" viewBox="0 0 120 132"><use href="#cat"/></svg>',
];
const gallery = $('#gallery');
photos.forEach((p, i) => {
  const f = document.createElement('figure');
  f.className = 'polaroid rv'; f.tabIndex = 0; f.setAttribute('role', 'button'); f.setAttribute('aria-label', 'Open photo ' + (i + 1));
  f.style.setProperty('--r', [-3, 2.5, -1.5, 3, -2.5, 1.5][i % 6] + 'deg');
  f.innerHTML = `<span class="tape${i % 2 ? ' t2' : ''}"></span><div class="ph empty"><div>${PH_ICON}your photo here</div></div><p></p>${STICKERS[i % STICKERS.length]}`;
  $('p', f).textContent = p.caption;
  if (p.src) {
    const im = new Image();
    im.onload = () => { p.ok = true; const ph = $('.ph', f); ph.classList.remove('empty'); ph.innerHTML = ''; ph.style.backgroundImage = `url("${p.src}")`; };
    im.src = p.src;
  }
  f.addEventListener('click', () => LB.open(i));
  f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); LB.open(i); } });
  gallery.appendChild(f);
});

/* ================================================================
   lightbox
   ================================================================ */
// Decide what a finger swipe on the open photo means.
// dx / dy: how far the finger moved in pixels (dx > 0 = moved right).
// Return 1 to show the next photo, -1 for the previous one, 0 to ignore.
function swipeDirection(dx, dy) {
  // TODO(human)
  return 0;
}
const LB = (() => {
  const lb = $('#lb'), img = $('#lbImg'), cap = $('#lbCap'), count = $('#lbCount');
  let idx = 0, lastFocus = null;
  function show(i) {
    idx = (i + photos.length) % photos.length;
    const p = photos[idx];
    img.src = p.ok ? p.src : placeholderURL(p); img.alt = p.caption;
    cap.textContent = p.caption; count.textContent = `${idx + 1} / ${photos.length}`;
  }
  function open(i) { lastFocus = document.activeElement; show(i); lb.classList.add('on'); $('#lbClose').focus(); }
  function close() { lb.classList.remove('on'); if (lastFocus) lastFocus.focus(); }
  $('#lbClose').addEventListener('click', close);
  $('#lbPrev').addEventListener('click', () => show(idx - 1));
  $('#lbNext').addEventListener('click', () => show(idx + 1));
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') show(idx + 1); else if (e.key === 'ArrowLeft') show(idx - 1);
  });
  let sx = 0, sy = 0;
  lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', e => {
    const t = e.changedTouches[0], dir = swipeDirection(t.clientX - sx, t.clientY - sy);
    if (dir) show(idx + dir);
  });
  return { open };
})();

/* ================================================================
   scenes
   ================================================================ */
const ORDER = ['s1', 's2', 's3', 's4', 's5', 's6'];
const dots = $('#dots'); ORDER.forEach(() => dots.appendChild(document.createElement('i')));
async function reveal(scene, run, gap = 140) {
  for (const el of scene.querySelectorAll('.rv')) { if (!alive(run)) return; el.classList.add('on'); await sleep(M(gap)); }
}
const enter = {};
async function go(id) {
  const run = ++state.run;
  const cur = state.scene && $('#' + state.scene);
  if (cur) cur.classList.remove('active');
  await sleep(cur ? M(500) : 0); if (!alive(run)) return;
  state.scene = id;
  const next = $('#' + id); next.scrollTop = 0;
  next.querySelectorAll('.rv').forEach(el => el.classList.remove('on'));
  next.classList.add('active');
  [...dots.children].forEach((d, i) => d.classList.toggle('on', ORDER[i] === id));
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
  (enter[id] || (() => reveal(next, run)))(run);
}
const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

// 1 — envelope
const env1 = $('#env1');
enter.s1 = run => { env1.classList.remove('open'); env1.classList.add('wiggle'); $('#openBtn').disabled = false; reveal($('#s1'), run, 260); };
async function openEnvelope() {
  if (env1.classList.contains('open')) return;
  const run = state.run;
  $('#openBtn').disabled = true; env1.classList.remove('wiggle'); env1.classList.add('open');
  Music.paper();
  await sleep(M(700)); if (!alive(run)) return;
  const [x, y] = centerOf(env1); FX.burst(x, y - 40, 160); Music.pop();
  await sleep(M(1500)); if (alive(run)) go('s2');
}
env1.addEventListener('click', openEnvelope);
env1.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); } });
$('#openBtn').addEventListener('click', openEnvelope);

// 2 — greeting
enter.s2 = run => { reveal($('#s2'), run, 220); setTimeout(() => alive(run) && FX.rain(70), M(500)); };
$('#toMemories').addEventListener('click', () => go('s3'));

// 3 — gallery
enter.s3 = run => reveal($('#s3'), run, 110);
$('#toLetter').addEventListener('click', () => go('s4'));

// 4 — letter
const env2 = $('#env2'), letter = $('#letter');
(L.paragraphs || []).forEach((t, i, a) => {
  const p = document.createElement('p'); p.textContent = t;
  if (i === 0) p.className = 'greet'; else if (i === a.length - 1) p.className = 'closing';
  letter.appendChild(p);
});
enter.s4 = run => {
  env2.classList.remove('open', 'away'); env2.classList.add('wiggle'); env2.style.display = '';
  letter.classList.remove('show'); letter.querySelectorAll('p').forEach(p => p.classList.remove('on'));
  $('#letterHint').style.display = ''; $('#toWish').hidden = true;
  reveal($('#s4'), run, 220);
};
async function openLetter() {
  if (env2.classList.contains('open')) return;
  const run = state.run;
  env2.classList.remove('wiggle'); env2.classList.add('open'); $('#letterHint').style.display = 'none';
  Music.paper();
  await sleep(M(1100)); if (!alive(run)) return;
  env2.classList.add('away');
  await sleep(M(650)); if (!alive(run)) return;
  env2.style.display = 'none'; letter.classList.add('show'); Music.chime();
  await sleep(M(500));
  for (const p of letter.querySelectorAll('p')) { if (!alive(run)) return; p.classList.add('on'); await sleep(M(700)); }
  if (!alive(run)) return;
  $('#toWish').hidden = false; $('#toWish').animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 500, easing: 'ease-out' });
}
env2.addEventListener('click', openLetter);
env2.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); } });
$('#toWish').addEventListener('click', () => go('s5'));

// 5 — make a wish
const cake = $('#cakeStage');
enter.s5 = run => {
  cake.classList.remove('out'); $('#blowBtn').disabled = false; $('#blowBtn').parentElement.style.display = '';
  $('#wishNote').classList.remove('show'); $('#toGift').hidden = true;
  reveal($('#s5'), run, 200);
};
$('#blowBtn').addEventListener('click', async () => {
  const run = state.run;
  $('#blowBtn').disabled = true; Music.blow();
  cake.classList.add('out');
  await sleep(M(600)); if (!alive(run)) return;
  const [x, y] = centerOf(cake); FX.burst(x, y - 60, 170); FX.rain(60); Music.pop();
  $('#blowBtn').parentElement.style.display = 'none';
  $('#wishNote').classList.add('show');
  await sleep(M(1300)); if (!alive(run)) return;
  $('#toGift').hidden = false; $('#toGift').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500 });
});
$('#toGift').addEventListener('click', () => go('s6'));

// 6 — gift
const gift = $('#gift');
enter.s6 = run => {
  gift.classList.remove('open'); gift.classList.add('idle'); $('#giftHint').style.display = '';
  $('#giftMsg').classList.remove('show'); kv.pause();
  reveal($('#s6'), run, 220);
};
async function openGift() {
  if (gift.classList.contains('open')) return;
  const run = state.run;
  gift.classList.remove('idle'); gift.classList.add('open'); $('#giftHint').style.display = 'none';
  const [x, y] = centerOf(gift); FX.burst(x, y - 30, 190, 1.2); Music.pop();
  await sleep(M(900)); if (!alive(run)) return;
  $('#giftMsg').classList.add('show'); FX.rain(80); Music.chime(); knightPlay();
  setTimeout(() => alive(run) && $('#giftMsg').scrollIntoView({ behavior: state.reduced ? 'auto' : 'smooth', block: 'nearest' }), M(500));
}
gift.addEventListener('click', openGift);
gift.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } });
$('#replay').addEventListener('click', () => go('s1'));

// the knight kitten clip (silent, loops; paused in less-motion mode)
const knight = $('#knight'), kv = $('#knightVid'), KN = GF.knight || {};
if (KN.src) { kv.src = KN.src; if (KN.poster) kv.poster = KN.poster; txt('#knightCap', KN.caption); } else knight.remove();
const knightPlay = () => { if (!KN.src) return; if (state.reduced) kv.pause(); else kv.play().catch(() => {}); };
motionBtn.addEventListener('click', () => { if ($('#giftMsg').classList.contains('show')) knightPlay(); });
kv.addEventListener('click', () => { if (kv.paused) kv.play().catch(() => {}); else kv.pause(); });

/* ================================================================
   start
   ================================================================ */
addEventListener('resize', () => FX.resize());
const start = /^#s[1-6]$/.test(location.hash) ? location.hash.slice(1) : 's1';
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => go(start));
})();
