<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fd">
<title>Happy Birthday 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --navy:#1f2d57; --ink:#2a3768; --blue:#3f6fd1; --sky:#9cc0f5; --ice:#e7effc; --silver:#c9d2df;
  --paper:#fdfdff; --bg:#f4f7fd; --line:#d7e2f5; --pink:#f3a9c0;
  --hand:'Caveat',cursive; --round:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1); --back:cubic-bezier(.34,1.56,.64,1);
  --card-shadow:0 1px 0 rgba(31,45,87,.06), 0 14px 34px rgba(31,45,87,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--body); color:var(--ink); overflow:hidden; background:var(--bg); -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px dashed var(--blue);outline-offset:5px;border-radius:12px}
svg.defs{position:absolute;width:0;height:0}

/* ---------- scenes ---------- */
.scene{
  position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; z-index:1;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg);
  opacity:0; visibility:hidden; transition:opacity .45s ease, visibility 0s linear .45s;
}
.scene.active{opacity:1; visibility:visible; z-index:2; transition:opacity .5s ease .25s, visibility 0s}
.scene.snap{transition:none!important}
.scene.turning{z-index:6; transform-origin:0 50%; box-shadow:12px 0 40px rgba(31,45,87,.25)}
/* nothing loops in a scene you can't see */
.scene:not(.active) *{animation-play-state:paused!important}
.wrap{position:relative; z-index:2; min-height:100%; max-width:760px; margin:0 auto; padding:84px 20px 72px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.decor{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden}
.decor > *{position:absolute}

/* ---------- shared bits ---------- */
.btn{
  display:inline-flex; align-items:center; gap:.5em; margin-top:26px; padding:15px 26px; border-radius:999px;
  font-family:var(--round); font-weight:600; font-size:clamp(16px,4.3vw,19px); letter-spacing:.2px; color:#fff;
  background:linear-gradient(180deg,#5a87e3,#2f58b8); box-shadow:0 6px 0 #22448f, 0 12px 26px rgba(40,70,150,.28);
  transition:transform .15s ease, box-shadow .15s ease, opacity .4s ease;
}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #22448f, 0 6px 14px rgba(40,70,150,.25)}
.btn.ghost{background:#fff; color:var(--navy); box-shadow:0 5px 0 var(--silver), 0 10px 20px rgba(40,70,150,.12); border:2px solid var(--silver)}
.btn[disabled]{opacity:.5; pointer-events:none}
.paper{position:relative; background:var(--paper); border-radius:6px; padding:26px 24px; box-shadow:var(--card-shadow)}
.tape{position:absolute; width:96px; height:28px; top:-13px; left:50%; transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(90deg, rgba(156,192,245,.78) 0 8px, rgba(190,214,250,.78) 8px 16px); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tape.t2{background:repeating-linear-gradient(45deg, rgba(201,210,223,.88) 0 6px, rgba(235,240,247,.88) 6px 12px)}
.hint{font-family:var(--hand); font-size:22px; color:#5c6c9c; margin-top:10px}
.squiggle{display:block; margin:10px auto 0; width:150px; height:14px; overflow:visible}
.squiggle path{stroke-dasharray:190; stroke-dashoffset:0}

/* denim-patch headings */
.h2{font-family:var(--round); font-weight:700; font-size:clamp(32px,9vw,50px); line-height:1.08; letter-spacing:.5px;
  background:repeating-linear-gradient(55deg,#4a72bd 0 2px,#3a5fa6 2px 4px,#5a82c9 4px 5px); -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:1.5px #fff; filter:drop-shadow(1.5px 0 0 #1f2d57) drop-shadow(-1.5px 0 0 #1f2d57) drop-shadow(0 1.5px 0 #1f2d57) drop-shadow(0 -1.5px 0 #1f2d57) drop-shadow(0 6px 8px rgba(31,45,87,.22))}

/* stickers: placed flat on the paper */
.sticker{filter:drop-shadow(0 3px 3px rgba(31,45,87,.28))}

/* ---------- the cats (built by catSVG) ---------- */
.kitty{overflow:visible; display:block}
.kitty .k-eyes{transform-box:fill-box; transform-origin:center; animation:blink var(--bt,5.2s) var(--bd,0s) infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.kitty .k-ear.r{transform-box:fill-box; transform-origin:40% 100%; animation:twitch 7s var(--td,2s) infinite}
@keyframes twitch{0%,87%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}93%{transform:rotate(6deg)}96%{transform:rotate(-3deg)}}
.kitty .k-tail{transform-box:fill-box; transform-origin:0 100%; animation:wag 2.6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
.kitty .k-arms{opacity:0; transform-box:view-box; transform-origin:60px 100px; transform:scale(.5); transition:opacity .2s ease, transform .35s var(--back)}
.kitty.celebrate .k-arms{opacity:1; transform:none}
.kitty.celebrate{animation:hop .5s cubic-bezier(.3,.7,.4,1) 4}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12%)}}
.kitty .k-wave{transform-box:view-box; transform-origin:92px 98px}
.kitty.waving .k-wave{animation:wave .8s ease-in-out 3}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-24deg)}70%{transform:rotate(14deg)}}
.kitty.toss{animation:hop .45s cubic-bezier(.3,.7,.4,1) 1}

/* ---------- HUD ---------- */
.hud{position:fixed; top:max(12px, env(safe-area-inset-top)); z-index:30; display:flex; gap:8px}
.hud.left{left:12px} .hud.right{right:12px}
.pill{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.9); border:1.5px solid var(--silver);
  font-family:var(--round); font-weight:600; font-size:14px; color:var(--navy); box-shadow:0 4px 12px rgba(31,45,87,.1)}
.pill svg{width:16px; height:16px}
#musicBtn .pause{display:none} #musicBtn.playing .play{display:none} #musicBtn.playing .pause{display:inline}
#motionBtn .dot{width:10px; height:10px; border-radius:50%; border:2px solid var(--navy)}
#motionBtn[aria-pressed="true"] .dot{background:var(--navy)}
.dots{position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom)); z-index:30; display:flex; gap:8px}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--silver); transition:all .4s ease}
.dots i.on{width:22px; border-radius:6px; background:var(--blue)}
@media (max-width:420px){ .pill .lbl{display:none} .pill{padding:9px 11px} }

/* ---------- envelope (S1 and S4) ---------- */
.env-stage{position:relative; margin:8px auto 0}
.env{position:relative; width:min(88vw,430px); aspect-ratio:1.42; perspective:1100px; cursor:pointer; transition:transform .35s var(--ease)}
.env > .back,.env > .front,.env > .flap,.env > .card{position:absolute; left:0; width:100%}
.env > .back{inset:0; height:100%; z-index:1; border-radius:10px; background:linear-gradient(160deg,#cfe0fb,#a9c6f3); box-shadow:0 14px 30px rgba(31,45,87,.2); transition:box-shadow .35s ease}
.env > .card{left:6%; width:88%; top:8%; height:84%; z-index:2; border-radius:6px; background:var(--paper); box-shadow:0 2px 6px rgba(0,0,0,.08);
  display:flex; align-items:flex-start; justify-content:center; padding-top:9%; transition:transform .85s var(--ease) .3s}
.env > .card span{font-family:var(--round); font-weight:700; font-size:clamp(18px,5vw,26px); color:var(--blue)}
.env > .front{bottom:0; height:100%; z-index:3; border-radius:10px; overflow:hidden; pointer-events:none}
.env > .front::before{content:""; position:absolute; inset:0; background:linear-gradient(170deg,#e3edfd,#bcd3f7); clip-path:polygon(0 0, 50% 54%, 100% 0, 100% 100%, 0 100%)}
.env > .front::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(31,45,87,.07), transparent 40%); clip-path:polygon(0 100%, 50% 50%, 100% 100%)}
.env > .flap{top:0; height:58%; z-index:4; transform-origin:50% 0; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.5,0,.2,1), filter .8s ease, z-index 0s .4s}
.env > .flap::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg,#d7e5fc,#b3cdf5); clip-path:polygon(0 0,100% 0,50% 100%); filter:drop-shadow(0 3px 2px rgba(31,45,87,.18))}
.env .seal{position:absolute; left:50%; top:58%; width:58px; height:58px; margin:-36px 0 0 -29px; z-index:6; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#ffffff,#d3dbe7 45%,#9aa8bd); box-shadow:0 3px 8px rgba(31,45,87,.3), inset 0 0 0 3px rgba(255,255,255,.5); display:grid; place-items:center}
.env .seal svg{width:28px; height:28px; fill:var(--blue); animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}14%{transform:scale(1.14)}28%{transform:scale(.97)}42%{transform:scale(1.08)}60%{transform:scale(1)}}
.env .seal::after{content:""; position:absolute; inset:-20%; background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%); transform:translateX(-120%); animation:glint 4.6s ease-in-out 1.5s infinite}
@keyframes glint{0%,70%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}
.env .addr{position:absolute; z-index:5; left:0; right:0; bottom:9%; padding:0 10%; font-family:var(--hand); color:var(--navy); line-height:1.1; pointer-events:none}
.env .addr b{display:block; font-size:clamp(24px,6.6vw,34px); font-weight:700}
.env .addr em{display:block; font-style:normal; font-size:clamp(19px,5vw,25px); color:#45579a}
.env .stk{position:absolute; z-index:7; pointer-events:none}
.env .peek{position:absolute; z-index:0; right:7%; top:-31%; width:27%}
.env.open > .flap{transform:rotateX(180deg); filter:brightness(.88); z-index:0}
.env.open > .card{transform:translateY(-46%)}
@media (hover:hover){
  .env:not(.open):hover{transform:translateY(-7px)}
  .env:not(.open):hover > .back{box-shadow:0 26px 44px rgba(31,45,87,.28)}
}
.env.wiggle{animation:wiggle 5s ease-in-out 1.6s infinite}
@keyframes wiggle{0%,84%,100%{transform:rotate(0)}87%{transform:rotate(-2.2deg)}91%{transform:rotate(2deg)}95%{transform:rotate(-1deg)}}
.xfer{position:fixed; z-index:20; background:var(--paper); border-radius:6px; display:flex; align-items:flex-start; justify-content:center; pointer-events:none; box-shadow:0 20px 50px rgba(31,45,87,.25)}
.xfer span{font-family:var(--round); font-weight:700; color:var(--blue); font-size:clamp(18px,5vw,26px); margin-top:6%}

/* ---------- S2 ---------- */
.bunting{position:absolute; top:0; left:-2%; width:104%; height:90px}
.bunting .flag{transform-box:fill-box; transform-origin:50% 0; animation:flutter 2.8s ease-in-out infinite alternate}
@keyframes flutter{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.bal{position:absolute}
.bal > svg{display:block; width:100%; height:auto; overflow:visible; transform-origin:50% 100%; animation:sway 5.5s ease-in-out infinite alternate}
.bal.d2 > svg{animation-duration:6.6s; animation-delay:-2s} .bal.d3 > svg{animation-duration:4.8s; animation-delay:-3.4s}
@keyframes sway{0%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(2deg) translateY(-10px)}100%{transform:rotate(3.5deg) translateY(-4px)}}
.bstr{transform-box:fill-box; transform-origin:50% 0; animation:strsway 2.2s ease-in-out infinite alternate}
@keyframes strsway{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.corner-cat{position:absolute; bottom:2%}
#s2 .paper{max-width:600px; margin-top:24px; font-size:clamp(16.5px,4.3vw,19px); line-height:1.7; text-align:left}

/* silver balloon lettering */
.balloon-title{font-family:var(--round); font-weight:700; line-height:1.02; font-size:clamp(46px,13.5vw,96px); letter-spacing:.5px; filter:drop-shadow(0 3px 0 #9aa8bd) drop-shadow(0 10px 16px rgba(31,45,87,.22))}
.balloon-title .w{display:inline-block; white-space:nowrap; margin:0 .14em}
.balloon-title .li{display:inline-block}
.balloon-title .l{
  display:inline-block;
  background-image:linear-gradient(105deg, transparent 0 40%, rgba(255,255,255,.95) 50%, transparent 60% 100%),
                   linear-gradient(180deg,#ffffff 0%,#dfe5ee 16%,#8d9aae 44%,#f4f7fa 58%,#6f7c92 84%,#c3ccd8 100%);
  background-size:320% 100%, 100% 100%; background-position:160% 0, 0 0; background-repeat:no-repeat;
  -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-stroke:2px #5f6c82;
}
.balloon-title .w.blue .l{background-image:linear-gradient(105deg, transparent 0 40%, rgba(255,255,255,.9) 50%, transparent 60% 100%),
  linear-gradient(180deg,#e6f0ff 0%,#9cc0f5 26%,#3f6fd1 55%,#9cc0f5 72%,#2f58b8 100%); -webkit-text-stroke-color:#2b4f9e}
.balloon-title.bobbing .l{animation:bob 3.4s ease-in-out calc(var(--i) * -.23s) infinite, shine 1.3s ease-in-out calc(var(--i) * 40ms + .15s) 1 backwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(calc(var(--r) * 1deg))}50%{transform:translateY(-6px) rotate(calc(var(--r) * -1deg))}}
@keyframes shine{from{background-position:160% 0, 0 0}to{background-position:-70% 0, 0 0}}

/* ---------- S3 gallery ---------- */
.gallery{display:grid; grid-template-columns:repeat(2,1fr); gap:34px 18px; width:100%; margin-top:30px; padding:0 4px}
@media (min-width:720px){ .gallery{grid-template-columns:repeat(3,1fr); gap:40px 26px} }
.pw{position:relative}
.polaroid{position:relative; z-index:1; background:#fff; padding:9px 9px 0; border-radius:3px; cursor:pointer; transform:rotate(var(--r));
  box-shadow:0 2px 4px rgba(31,45,87,.08), 0 12px 24px rgba(31,45,87,.14); transition:transform .35s var(--ease), box-shadow .35s ease}
@media (hover:hover){ .polaroid:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.035); box-shadow:0 22px 36px rgba(31,45,87,.22); z-index:3} }
.polaroid:active{transform:rotate(var(--r)) scale(.965); transition-duration:.12s}
.polaroid .ph{aspect-ratio:1; background:var(--ice) center/cover no-repeat; border-radius:2px; overflow:hidden; display:grid; place-items:center}
.polaroid .ph.empty{background:repeating-linear-gradient(135deg,#eef4fe 0 12px,#e4edfc 12px 24px)}
.polaroid .ph.empty div{font-family:var(--hand); color:#6f80b0; font-size:19px; line-height:1}
.polaroid .ph.empty svg{width:46%; height:auto; display:block; margin:0 auto 4px}
.polaroid p{font-family:var(--hand); font-size:clamp(17px,4.6vw,21px); line-height:1.05; color:var(--navy); padding:9px 2px 12px; min-height:3.2em; display:flex; align-items:center; justify-content:center}
.polaroid .tape{width:70px; height:22px; top:-10px}
.polaroid .stk{position:absolute; width:44px; height:44px; pointer-events:none; z-index:2}
.peeker{position:absolute; z-index:0; left:14%; top:-34px; width:62px; transform:translateY(70%); animation:peekloop 11s ease-in-out var(--pd,3s) infinite}
@keyframes peekloop{0%,62%,100%{transform:translateY(70%)}68%,86%{transform:translateY(0)}72%{transform:translateY(-4%) rotate(-4deg)}}

/* lightbox (shared-element zoom from the tapped frame) */
.lb{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:20px; visibility:hidden}
.lb.on{visibility:visible}
.lb-bg{position:absolute; inset:0; background:rgba(22,32,64,.62); opacity:0; transition:opacity .35s ease}
.lb.on .lb-bg{opacity:1} .lb.closing .lb-bg{opacity:0}
.lb-body{position:relative}
.lb-card{background:#fff; padding:12px 12px 0; border-radius:4px; box-shadow:0 30px 60px rgba(0,0,0,.35); max-width:min(92vw,560px); transform-origin:0 0}
.lb-img{display:block; max-width:100%; max-height:62vh; margin:0 auto; border-radius:2px}
.lb-card p{font-family:var(--hand); font-size:clamp(22px,6vw,28px); color:var(--navy); text-align:center; padding:12px 6px 14px}
.lb-nav{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; transition:opacity .3s ease}
.lb.closing .lb-nav,.lb.closing .lb-close{opacity:0}
.lb-nav button{width:46px; height:46px; border-radius:50%; background:#fff; color:var(--navy); font-size:22px; box-shadow:0 6px 14px rgba(0,0,0,.2)}
.lb-nav span{color:#fff; font-family:var(--round); font-weight:600; min-width:56px; text-align:center}
.lb-close{position:absolute; z-index:2; top:max(14px, env(safe-area-inset-top)); right:14px; width:46px; height:46px; border-radius:50%; background:#fff; color:var(--navy); font-size:22px; box-shadow:0 6px 14px rgba(0,0,0,.2); transition:opacity .3s ease}

/* ---------- S4 letter ---------- */
#s4 .env{width:min(78vw,360px)}
#s4 .env > .back{background:linear-gradient(160deg,#2f4f99,#1f2d57)}
#s4 .env > .front::before{background:linear-gradient(170deg,#3d62b5,#26407e)}
#s4 .env > .flap::before{background:linear-gradient(180deg,#4a70c2,#2c4b92)}
#s4 .env .addr{color:#fff; bottom:12%} #s4 .env .addr b{font-size:clamp(26px,7vw,34px)}
.letter-wrap{position:relative; width:100%; max-width:600px; margin:4px 0 46px}
.letter{position:relative; z-index:1; text-align:left; transform-origin:50% 0;
  background:linear-gradient(transparent 31px, #dfe8f8 32px) 0 14px/100% 32px, var(--paper);
  padding:34px 26px 26px 36px; font-family:var(--hand); font-size:clamp(22px,5.8vw,27px); line-height:32px; color:var(--navy); border-left:3px double #f2b8c9}
.letter p{margin-bottom:16px}
.letter p.greet{font-size:1.25em; font-weight:700; color:var(--blue)}
.letter p.closing{font-weight:700; margin-bottom:4px}
.doodle-heart{display:block; width:62px; height:56px; margin:0 0 0 auto; overflow:visible}
.doodle-heart path{stroke-dasharray:260; stroke-dashoffset:0}
/* peeks out from under the paper's lower-right corner */
.letter-peek{position:absolute; z-index:0; right:16px; bottom:-52px; width:78px; transform:rotate(-7deg)}

/* ---------- S5 cake ---------- */
.cake-stage{position:relative; z-index:4; width:min(92vw,520px); margin-top:14px}
.cake-stage svg.cake{display:block; width:62%; margin:0 auto; overflow:visible}
.cake-stage .cat-in{position:absolute; bottom:0; width:27%}
.cake g{transform-box:fill-box}
.fl-a{transform-origin:50% 100%; animation:flA .37s ease-in-out infinite alternate}
.fl-b{transform-origin:50% 100%; animation:flB .61s ease-in-out infinite alternate}
@keyframes flA{from{transform:scale(1,1)}to{transform:scale(.9,1.09)}}
@keyframes flB{from{transform:skewX(-4deg)}to{transform:skewX(5deg) translateX(.6px)}}
.flame-wrap{transform-origin:50% 100%}
.glow{transform-box:fill-box; transform-origin:center; animation:glowA 2.3s ease-in-out infinite alternate, glowB 3.1s ease-in-out infinite alternate}
@keyframes glowA{from{opacity:.32}to{opacity:.55}}
@keyframes glowB{from{transform:scale(.92)}to{transform:scale(1.08)}}
.out .fl-a,.out .fl-b,.out .glow{animation:none}
.smoke{opacity:0; stroke-dasharray:110; stroke-dashoffset:110}
.dim{position:fixed; inset:0; z-index:3; pointer-events:none; opacity:0; transition:opacity .5s ease;
  background:radial-gradient(60% 42% at 50% 46%, rgba(15,22,48,.12), rgba(15,22,48,.55))}
.dim.on{opacity:1}
.wish-note{max-width:520px; margin-top:18px; font-family:var(--hand); font-size:clamp(26px,7vw,34px); line-height:1.15; color:var(--navy); transform:rotate(-1deg)}

/* ---------- S6 gift ---------- */
.gift{position:relative; width:min(62vw,260px); aspect-ratio:1/1.02; margin:30px auto 0; cursor:pointer}
.gift .box{position:absolute; left:6%; right:6%; bottom:0; height:66%; border-radius:6px; background:linear-gradient(180deg,#4f7fe0,#2c50a8); box-shadow:inset 0 -10px 0 rgba(0,0,0,.12), 0 16px 30px rgba(31,45,87,.3)}
.gift .box::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%); background:linear-gradient(90deg,#b9c4d4,#f4f7fb 45%,#a7b4c7)}
.gift .box::after{content:""; position:absolute; inset:0; border-radius:6px; background:radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 3px, transparent 4px) 0 0/34px 34px}
.gift .lid{position:absolute; left:0; right:0; top:22%; height:18%; border-radius:6px; background:linear-gradient(180deg,#6b95ea,#3a63c0); box-shadow:0 6px 10px rgba(31,45,87,.25); transition:transform .9s var(--ease); transform-origin:20% 100%; z-index:2}
.gift .lid::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%); background:linear-gradient(90deg,#b9c4d4,#f4f7fb 45%,#a7b4c7)}
.gift .bow{position:absolute; left:50%; bottom:100%; width:62%; transform:translateX(-50%); margin-bottom:-6px}
.gift.idle{animation:shake 3s ease-in-out infinite}
@keyframes shake{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-4deg)}88%{transform:rotate(4deg)}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}
.gift.open .lid{transform:translate(18%,-130%) rotate(24deg)}
.gift .rays{position:absolute; left:50%; top:40%; width:220%; aspect-ratio:1; transform:translate(-50%,-50%) scale(.3); opacity:0; z-index:-1; pointer-events:none;
  background:repeating-conic-gradient(rgba(156,192,245,.45) 0 9deg, transparent 9deg 22deg); border-radius:50%;
  -webkit-mask:radial-gradient(circle, #000 20%, transparent 68%); mask:radial-gradient(circle, #000 20%, transparent 68%); transition:opacity .8s ease, transform 1.2s var(--ease)}
.gift.open .rays{opacity:1; transform:translate(-50%,-50%) scale(1)}
.gift-msg{max-width:560px; margin-top:24px}
.gift-msg .paper{font-size:clamp(18px,4.8vw,22px); line-height:1.6}
.polaroid.knight{max-width:min(78vw,330px); margin:34px auto 0; cursor:default; --r:-2deg}
.polaroid.knight:hover{transform:rotate(-2deg)}
.polaroid.knight video{display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#dfe6f0; border-radius:2px}
.made{font-family:var(--hand); font-size:clamp(26px,7vw,32px); color:var(--blue); margin-top:22px}

#fx{position:fixed; inset:0; width:100%; height:100%; z-index:35; pointer-events:none}
#ytHolder{position:fixed; left:-9999px; width:1px; height:1px}

/* ---------- less motion: no loops, no 3D, just fades ---------- */
.reduced *, .reduced .scene *{animation:none!important}
.reduced .env, .reduced .polaroid, .reduced .lid, .reduced .flap{transition-duration:.2s!important}
.reduced .polaroid:hover{transform:rotate(var(--r))}
.reduced .peeker{transform:translateY(70%)}

/* ----------------------------------------------------------------
   play(): one animation on one element, tagged so a scene reset can
   cancel it. Entrances use fill:'backwards' — hidden until their turn,
   then the element's own CSS takes over (so hover/idle still work).
   With "Less motion" every entrance becomes a short fade.
   ---------------------------------------------------------------- */
function play(el, frames, o = {}) {
  if (!el) return Promise.resolve();
  let opts = Object.assign({ duration: 700, easing: EASE.out, fill: 'backwards', delay: 0, id: 'e' }, o);
  delete opts.reduced; delete opts.keep;
  if (state.reduced) {
    if (o.reduced) frames = o.reduced;
    else if (!o.keep) frames = [{ opacity: 0 }, { opacity: 1 }];
    opts.duration = Math.min(opts.duration, 320); opts.delay = opts.delay * .3; opts.easing = 'ease';
  }
  const a = el.animate(frames, opts);
  return a.finished.then(() => true, () => false);
}
const cancelAnims = root => root.getAnimations({ subtree: true }).forEach(a => { if (a.id === 'e') a.cancel(); });
const fadeUp = (el, delay = 0, dist = 14) => play(el, [{ opacity: 0, transform: `translateY(${dist}px)` }, { opacity: 1, transform: 'none' }], { duration: 600, delay });
// hand-drawn lines draw themselves: dash length = path length, offset slides to 0
const drawLine = (path, delay = 0, dur = 700) => {
  const len = Math.ceil(path.getTotalLength()) + 2;
  path.style.strokeDasharray = len;
  return play(path, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: dur, delay, easing: EASE.soft, reduced: [{ opacity: 0 }, { opacity: 1 }] });
};

/* sticker placement: big + lifted shadow -> pressed flat onto the paper */
function placeSticker(el, delay) {
  const r = +(el.dataset.r || 0);
  return play(el, [
    { opacity: 0, transform: `scale(1.7) rotate(${r - 22}deg)`, filter: 'drop-shadow(0 18px 12px rgba(31,45,87,.28))' },
    { opacity: 1, transform: `scale(.9) rotate(${r + 4}deg)`, filter: 'drop-shadow(0 1px 1px rgba(31,45,87,.35))', offset: .72 },
    { opacity: 1, transform: `scale(1) rotate(${r}deg)`, filter: 'drop-shadow(0 3px 3px rgba(31,45,87,.28))' },
  ], { duration: 520, delay, easing: EASE.land });
}

/* ================================================================
   confetti: blue / navy / silver / white pieces, stars and hearts
   ================================================================ */
function sprite(size, draw) { const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); return c; }
const COLORS = ['#3f6fd1', '#1f2d57', '#9cc0f5', '#c9d2df', '#ffffff', '#5a87e3'];
const starSprite = col => sprite(64, (x, S) => {
  x.translate(S / 2, S / 2); x.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? S * .19 : S * .44; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  x.closePath(); x.fillStyle = col; x.fill(); x.strokeStyle = 'rgba(31,45,87,.35)'; x.lineWidth = 2; x.stroke();
});
const heartSprite = col => sprite(64, (x, S) => {
  const p = new Path2D('M50 88C20 66 2 48 2 28 2 13 13 3 27 3c10 0 18 6 23 15C55 9 63 3 73 3c14 0 25 10 25 25 0 20-18 38-48 60z');
  x.scale(S / 100, S / 100); x.translate(0, 4); x.fillStyle = col; x.fill(p);
});
const STARS = ['#c9d2df', '#3f6fd1', '#9cc0f5'].map(starSprite);
const HEARTS = ['#9cc0f5', '#c9d2df', '#3f6fd1', '#f3a9c0'].map(heartSprite);

const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W, H, dpr, P = [], running = false, last = 0;
  const cap = () => (W < 600 ? 170 : 300) * (state.reduced ? .35 : 1);
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i]; p.life += dt;
      if (p.life > p.max || p.y > H + 60) { P.splice(i, 1); continue; }
      const dr = Math.pow(p.drag, dt);
      p.vx *= dr; p.vy = p.vy * dr + p.g * dt;
      p.x += (p.vx + Math.sin(p.life * p.sw + p.ph) * p.swA) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const u = p.life / p.max;
      ctx.globalAlpha = (u > .7 ? (1 - u) / .3 : 1) * p.a;
      ctx.setTransform(dpr * Math.cos(p.rot), dpr * Math.sin(p.rot), -dpr * Math.sin(p.rot), dpr * Math.cos(p.rot), dpr * p.x, dpr * p.y);
      if (p.img) ctx.drawImage(p.img, -p.size / 2, -p.size / 2, p.size, p.size);
      else { ctx.scale(1, Math.cos(p.life * p.flip + p.ph)); ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size * .3, p.size, p.size * .6); }
    }
    ctx.globalAlpha = 1;
    if (P.length) requestAnimationFrame(loop); else { running = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  function add(p) {
    if (P.length >= cap()) return;
    P.push(Object.assign({ life: 0, rot: rand(0, 6.3), vr: rand(-5, 5), drag: .5, g: 520, sw: rand(2, 5), swA: rand(10, 40), ph: rand(0, 6.3), flip: rand(5, 12), max: rand(2.4, 4), a: 1 }, p));
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
  }
  const piece = (kind = Math.random()) => kind < .14 ? { img: pick(STARS), size: rand(16, 26) } : kind < .24 ? { img: pick(HEARTS), size: rand(16, 26) } : { img: null, col: pick(COLORS), size: rand(8, 14) };
  const n = k => Math.round(k * (state.reduced ? .3 : 1));
  return {
    resize,
    burst(x, y, k = 140, spread = 1) {
      for (let i = 0; i < n(k); i++) { const a = -Math.PI / 2 + rand(-1.25, 1.25) * spread, sp = rand(360, 1050); add(Object.assign({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: .12 }, piece())); }
    },
    // a soft stream of hearts and stars rising out of an opening (envelope mouth)
    trail(x, y, w, run) {
      for (let k = 0; k < 9; k++) setTimeout(() => {
        if (!alive(run)) return;
        for (let i = 0; i < n(3); i++) add({ x: x + rand(-w / 2, w / 2), y, vx: rand(-70, 70), vy: rand(-460, -280), g: 240, drag: .55, img: Math.random() < .55 ? pick(HEARTS) : pick(STARS), size: rand(14, 24), max: rand(1.6, 2.4), vr: rand(-2, 2) });
      }, k * 70);
    },
    // a little handful thrown up and outwards (dir -1 = left, 1 = right)
    toss(x, y, dir) {
      for (let i = 0; i < n(22); i++) { const a = -Math.PI / 2 + dir * rand(.1, .7), sp = rand(380, 640); add(Object.assign({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: .3, max: rand(1.8, 2.8) }, piece())); }
    },
    // confetti cannons from a bottom corner, aimed up and inwards
    cannon(side) {
      const x = side < 0 ? -10 : W + 10, y = H * .92;
      for (let i = 0; i < n(80); i++) { const a = -Math.PI / 2 - side * rand(.06, .34), sp = rand(650, 1150); add(Object.assign({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: .18 }, piece())); }
    },
    // gentle falling confetti that keeps to the left and right edges
    edges(k = 50) {
      for (let i = 0; i < n(k); i++) { const left = Math.random() < .5, x = left ? rand(0, W * .17) : rand(W * .83, W); add(Object.assign({ x, y: rand(-H * .4, -20), vx: rand(-20, 20), vy: rand(40, 120), g: 50, drag: .9, max: rand(4, 6.5), swA: rand(6, 16) }, piece(Math.random() * .9 + .1))); }
    },
    calm() { P.forEach(p => { p.max = Math.min(p.max, p.life + .6); }); },
  };
})();
FX.resize();

/* ================================================================
   music: never automatic — only the Play button starts it.
   YouTube link, or a file, or a built-in music-box "Happy Birthday".
   Sound effects only play while music is switched on.
   ================================================================ */
const Music = (() => {
  const cfg = Object.assign({ youtube: '', src: '', volume: .8 }, C.music || {});
  const btn = $('#musicBtn'), lbl = $('#musicLbl');
  const ytId = (v => { const m = String(v || '').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(v) ? v : ''); })(cfg.youtube);
  const canYT = !!ytId && /^https?:$/.test(location.protocol);
  let on = false, ctx = null, master, bus, verb, timer = null, el = null, yt = null, ytReady = false;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function ui() { btn.classList.toggle('playing', on); lbl.textContent = on ? 'Pause music' : 'Play music'; btn.setAttribute('aria-label', on ? 'Pause music' : 'Play music'); }
  function audio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    verb = ctx.createConvolver();
    const len = ctx.sampleRate * 2.4, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = b; const wet = ctx.createGain(); wet.gain.value = .35; verb.connect(wet); wet.connect(master);
    bus = ctx.createGain(); bus.gain.value = 0; bus.connect(master); bus.connect(verb);
  }
  function tine(m, t, v, dest = bus) {
    const f = mtof(m), g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + 1.8);
    [[1, 1], [2.0, .28], [4.2, .1]].forEach(([k, a]) => { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * k; const og = ctx.createGain(); og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.9); });
    g.connect(dest);
  }
  // Happy Birthday (traditional, public domain)
  const MEL = [[67,0],[67,.75],[69,1],[67,2],[72,3],[71,4],[67,6],[67,6.75],[69,7],[67,8],[74,9],[72,10],[67,12],[67,12.75],[79,13],[76,14],[72,15],[71,16],[69,17],[77,19],[77,19.75],[76,20],[72,21],[74,22],[72,23]];
  const CH = [[1,[48,52,55]],[4,[43,50,53]],[7,[43,50,53]],[10,[48,52,55]],[13,[48,52,55]],[16,[41,48,53]],[20,[48,52,55]],[22,[43,50,53]],[23,[48,52,55]]];
  const LOOP = 28, BEAT = .62;
  function startBox() {
    let t0 = ctx.currentTime + .2;
    const schedule = () => { MEL.forEach(([m, b]) => tine(m + 12, t0 + b * BEAT, .16)); CH.forEach(([b, ns]) => ns.forEach((m, i) => tine(m + 12, t0 + b * BEAT + i * .03, .05))); t0 += LOOP * BEAT; };
    schedule(); timer = setInterval(() => { if (t0 - ctx.currentTime < 3) schedule(); }, 500);
  }
  function play() {
    audio();
    if (ctx) { master.gain.setTargetAtTime(1, ctx.currentTime, .05); bus.gain.setTargetAtTime(clamp(cfg.volume, 0, 1), ctx.currentTime, .4); }
    if (canYT) { if (yt && ytReady) { yt.setVolume(Math.round(clamp(cfg.volume, 0, 1) * 100)); yt.playVideo(); } else if (!yt) loadYT(); return; }
    if (cfg.src) { if (!el) { el = new Audio(cfg.src); el.loop = true; } el.volume = clamp(cfg.volume, 0, 1); el.play().catch(() => { el = null; if (!timer && ctx) startBox(); }); return; }
    if (!timer && ctx) startBox();
  }
  function pause() { if (yt && ytReady) try { yt.pauseVideo(); } catch (e) {} if (el) el.pause(); if (ctx) bus.gain.setTargetAtTime(0, ctx.currentTime, .15); }
  function loadYT() {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('ytHolder', { videoId: ytId, width: 200, height: 200, playerVars: { autoplay: 0, controls: 0, playsinline: 1, loop: 1, playlist: ytId, rel: 0 },
        events: { onReady() { ytReady = true; if (on) { yt.setVolume(Math.round(clamp(cfg.volume, 0, 1) * 100)); yt.playVideo(); } }, onError() { if (on && ctx && !timer) startBox(); } } });
    };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => { if (on && ctx && !timer) startBox(); }; document.head.appendChild(s);
  }
  btn.addEventListener('click', () => { on = !on; if (on) play(); else pause(); ui(); });
  document.addEventListener('visibilitychange', () => { if (!on) return; if (document.hidden) { if (ctx) ctx.suspend(); if (el) el.pause(); } else { if (ctx) ctx.resume(); if (el) el.play().catch(() => {}); } });
  ui();
  function sfx(fn) { if (!on) return; audio(); if (ctx) fn(ctx.currentTime + .01); }
  function noise(t, dur, f1, f2, v) {
    const len = Math.floor(ctx.sampleRate * dur), b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = ctx.createBufferSource(); s.buffer = b; const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .8;
    bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain(); g.gain.value = v; s.connect(bp); bp.connect(g); g.connect(master); s.start(t);
  }
  return {
    paper: () => sfx(t => noise(t, .5, 3000, 900, .12)),
    chime: () => sfx(t => [84, 88, 91, 96].forEach((m, i) => tine(m, t + i * .09, .12, master))),
    pop: () => sfx(t => { noise(t, .35, 2000, 500, .25); [79, 84, 88, 91, 96].forEach((m, i) => tine(m, t + .05 + i * .07, .1, master)); }),
    blow: () => sfx(t => noise(t, .9, 700, 300, .35)),
    tick: () => sfx(t => tine(pick([91, 93, 96]), t, .05, master)),
  };
})();

}
env2.addEventListener('click', openLetter);
env2.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); } });
$('#toWish').addEventListener('click', () => go('s5', { push: true }));

/* ================================================================
   S5 — make a wish
   ================================================================ */
const cake = $('#cakeStage'), dim = $('#dim'), blowBtn = $('#blowBtn'), catL = $('#cakeCatL'), catR = $('#cakeCatR');
let blown = false;
reset.s5 = () => {
  blown = false; cake.classList.remove('out'); dim.classList.remove('on'); blowBtn.disabled = true;   // unlocked once the cake is built
  $('#blowRow').hidden = false; $('#wishNote').hidden = true; $('#toGift').hidden = true;
  [catL, catR].forEach(k => k.classList.remove('celebrate'));
};
leave.s5 = () => { dim.classList.remove('on'); };
enter.s5 = (run, b) => {
  play($('#wishTitle'), [{ opacity: 0, transform: 'translateY(-20px) scale(.9)' }, { opacity: 1, transform: 'scale(1.04)', offset: .7 }, { transform: 'none' }], { duration: 600, delay: b, easing: EASE.soft });
  drawLine($('#s5 .squiggle path'), b + 300);
  $$('#s5 .bal').forEach((bl, i) => play(bl, [{ opacity: 0, transform: `translateY(${Math.round(innerHeight * .8)}px)` }, { opacity: 1, offset: .15 }, { transform: 'none' }], { duration: 1600, delay: b + 100 + i * 150, easing: 'cubic-bezier(.2,.7,.3,1)' }));
  $$('#s5 .decor .sticker').forEach((s, i) => placeSticker(s, b + 900 + i * 100));
  // the cake is built: plate, bottom tier, top tier, candle
  ['.c-plate', '.c-bot', '.c-top', '.c-candle'].forEach((sel, i) => play($(sel, cake), [
    { opacity: 0, transform: `translateY(${-50 - i * 6}px)` }, { opacity: 1, transform: 'translateY(4px)', offset: .7 }, { transform: 'none' }], { duration: 520, delay: b + 300 + i * 220, easing: EASE.land }));
  // the cats come in from opposite sides
  $$('.cat-in', cake).forEach((c, i) => play(c, [
    { opacity: 0, transform: `translateX(${i ? 130 : -130}%)` }, { opacity: 1, transform: `translateX(${i ? -6 : 6}%) translateY(-10%)`, offset: .65 }, { transform: 'none' }],
    { duration: 750, delay: b + 1150 + i * 140, easing: EASE.soft }));
  fadeUp($('#blowRow'), b + 1500);
  setTimeout(() => { if (alive(run) && !blown) blowBtn.disabled = false; }, M(b + 1700));
};
blowBtn.addEventListener('click', async () => {
  if (blown || state.scene !== 's5') return;
  blown = true; blowBtn.disabled = true;
  const run = state.run;
  dim.classList.add('on'); Music.blow();
  await sleep(M(450)); if (!alive(run)) return;
  // the flame leans away, shrinks and goes out, leaving a curl of smoke
  const fw = $('.flame-wrap', cake);
  cake.classList.add('out');
  play($('.glow', cake), [{ opacity: .5 }, { opacity: 0 }], { duration: 500, fill: 'forwards', keep: true });
  await play(fw, [{ transform: 'none' }, { transform: 'skewX(-26deg) translateX(-3px) scale(.85)', offset: .45 }, { transform: 'skewX(-34deg) translateX(-5px) scale(0,.15)', opacity: 0 }], { duration: 560, fill: 'forwards', easing: EASE.soft, keep: true, reduced: [{ opacity: 1 }, { opacity: 0 }] });
  if (!alive(run)) return;
  play($('.smoke', cake), [
    { opacity: 0, strokeDashoffset: 110, transform: 'translateY(0)' },
    { opacity: .85, offset: .25 },
    { opacity: 0, strokeDashoffset: 0, transform: 'translateY(-34px)' }], { duration: 1900, fill: 'forwards', easing: 'ease-out', keep: true });
  await sleep(M(700)); if (!alive(run)) return;
  dim.classList.remove('on');
  // celebration: paws up, a little bounce, confetti from both sides
  [catL, catR].forEach(k => { k.classList.remove('celebrate'); void k.offsetWidth; k.classList.add('celebrate'); });
  FX.cannon(-1); FX.cannon(1); Music.pop();
  await sleep(M(900)); if (!alive(run)) return;
  $('#blowRow').hidden = true; $('#wishNote').hidden = false; FX.calm();   // the party fades so the message gets the spotlight
  play($('#wishNote'), [{ opacity: 0, transform: 'scale(.8) rotate(-4deg)' }, { opacity: 1, transform: 'scale(1.05) rotate(0deg)', offset: .65 }, { transform: 'rotate(-1deg)' }], { duration: 650, easing: EASE.soft });
  await sleep(M(1300)); if (!alive(run)) return;
  $('#toGift').hidden = false; fadeUp($('#toGift'), 0);
  setTimeout(() => alive(run) && [catL, catR].forEach(k => k.classList.remove('celebrate')), 2200);
});
$('#toGift').addEventListener('click', () => go('s6', { push: true }));

/* ================================================================
   S6 — the gift
   ================================================================ */
const gift = $('#gift'), knight = $('#knight'), kv = $('#knightVid'), KN = GF.knight || {};
if (KN.src) { kv.src = KN.src; if (KN.poster) kv.poster = KN.poster; txt('#knightCap', KN.caption); } else knight.remove();
const knightPlay = () => { if (!KN.src) return; if (state.reduced) kv.pause(); else kv.play().catch(() => {}); };
let opened6 = false;
reset.s6 = () => { opened6 = false; gift.classList.remove('open'); gift.classList.add('idle'); $('#giftHint').hidden = false; $('#giftMsg').hidden = true; kv.pause(); };
leave.s6 = () => kv.pause();
enter.s6 = (run, b) => {
  play($('#giftTitle'), [{ opacity: 0, transform: 'translateY(-20px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: b, easing: EASE.out });
  drawLine($('#s6 .squiggle path'), b + 300);
  play(gift, [{ opacity: 0, transform: 'translateY(-60px) scale(.9)' }, { opacity: 1, transform: 'translateY(6px)', offset: .7 }, { transform: 'none' }], { duration: 750, delay: b + 300, easing: EASE.land });
  $$('#s6 .bal').forEach((bl, i) => play(bl, [{ opacity: 0, transform: `translateY(${Math.round(innerHeight * .8)}px)` }, { opacity: 1, offset: .15 }, { transform: 'none' }], { duration: 1600, delay: b + 100 + i * 150, easing: 'cubic-bezier(.2,.7,.3,1)' }));
  $$('#s6 .sticker').forEach((s, i) => placeSticker(s, b + 800 + i * 100));
  fadeUp($('#giftHint'), b + 900);
};
async function openGift() {
  if (opened6 || state.scene !== 's6') return;
  opened6 = true;
  const run = state.run;
  gift.classList.remove('idle'); gift.classList.add('open'); $('#giftHint').hidden = true;
  const [x, y] = centerOf(gift); FX.burst(x, y - 30, 170, 1.2); Music.pop();
  await sleep(M(900)); if (!alive(run)) return;
  $('#giftMsg').hidden = false; fadeUp($('#giftMsg'), 0, 20); FX.edges(50); Music.chime(); knightPlay();
  setTimeout(() => alive(run) && $('#giftMsg').scrollIntoView({ behavior: state.reduced ? 'auto' : 'smooth', block: 'nearest' }), M(500));
}
gift.addEventListener('click', openGift);
gift.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGift(); } });
$('#replay').addEventListener('click', () => go('s1', { push: true }));
motionBtn.addEventListener('click', () => { if (!$('#giftMsg').hidden) knightPlay(); });
kv.addEventListener('click', () => { if (kv.paused) kv.play().catch(() => {}); else kv.pause(); });

/* ================================================================
   start
   ================================================================ */
addEventListener('resize', () => FX.resize());
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => go(hashScene()));
})();
</script>
</body>
